name: Notify on Deploy

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version and changelog from comment block
        id: ver
        run: |
          VER=$(grep -o "const VER='[^']*'" index.html | grep -o "'[^']*'" | tr -d "'")
          echo "version=$VER" >> $GITHUB_OUTPUT

          # Grab this version's changelog entry from the HTML comment block
          NOTES=$(sed -n "/^  ${VER//./\\.} - /,/^  v[0-9]/{ /^  v[0-9]/!p; /^  ${VER//./\\.}/p; }" index.html \
            | sed 's/^  *//g' \
            | tr '\n' ' ' \
            | sed "s/^${VER//./\\.} - //" \
            | sed 's/  */ /g' \
            | head -c 200)
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Send push notification with changelog
        run: |
          BODY="${{ steps.ver.outputs.notes }}"
          if [ -z "$BODY" ]; then
            BODY="Open the app to see what's new"
          fi
          curl -s -X POST https://cfh-push.jivancheemalfc.workers.dev \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"Family Hub updated to ${{ steps.ver.outputs.version }}\",\"body\":\"$BODY\",\"addedBy\":\"__system__\",\"notifyAll\":true}"
