  - renderContent()     — re-renders current tab
  - renderTabs()        — re-renders tab bar
  - setTab(i)           — switches to tab i with real slide animation
  - fbRead()            — reads all data from Firebase
  - fbWrite(path, data) — writes to Firebase
  - postNote()          — sends a message (keyboard stays up)
  - bindSwipe(outer)    — attaches swipe-to-delete (axis-locked)
  - initTabSwipe()      — edge-aware tab swipe gestures
  - initPullRefresh()   — sets up pull-to-refresh (1400ms min)
  - openFilterSheet()   — opens filter/sort bottom sheet
  - selectMember(name)  — logs in as a family member
  - haptic(pattern)     — triggers haptic feedback
  - delItem(id)         — deletes item from current tab
  - checkVersionUpdate()— shows "What's New" popup (auto-parses changelog)
  - retagOthers()       — on version change, re-runs suggestCat on shop
                          items still tagged 'other' (catches items that
                          fit a category added in a later release)
  - showUpdatePopup(prev)— fetches page source, extracts changelog for VER
  - showInstallPopup()  — first-open install-to-home-screen guide
  - sendPushNotif(t,b,addedBy) — sends push, excludes sender's devices

  DARK MODE: :root.dark class on documentElement (NOT body)
  THEME INIT: script in <head> before paint to avoid flash
  SW PATH: /cheema-family-hub/sw.js

  VERSION FORMAT — STRICTLY FOLLOW THIS:
  vMAJOR.MEDIUM.SMALL
  - MAJOR (1st number): huge app-changing redesign or structural overhaul
  - MEDIUM (2nd number): new features or significant behaviour changes
  - SMALL (3rd number): bug fixes, cosmetic tweaks, minor improvements

  - v4.2.1 → v5.0.0  (complete redesign)
  - v4.2.1 → v4.3.0  (added a new feature)

  6. Never remove or rename key functions without updating

  7. Keep CHANGELOG entries SHORT — aim for 1-3 sentences per

  CHANGELOG:

            latest keyword list once on first boot of a new version,
            and reclassified if anything matches now. Items that
            still don't fit any category keep the Other tag. Picks

  v5.4.0 - Two new shopping categories: "Cereal" (cornflakes,

            Cadbury / Walkers / Pringles / Oreo / KitKat). Branded
            cereals and treats now match these dedicated buckets
            instead of falling into Bakery or Tins, so the filter
            sheet's category list is more useful.
  v5.3.1 - Three small fixes: (1) "What's New" popup is now a fixed
            max-height with internal scroll, so a long changelog can't
            push the "Got it" button off the screen. (2) The right-
            edge column (camera + category tag) is now a fixed width
            per item, so the camera / tag / X-button stay perfectly
            aligned across items regardless of category name length.
            (3) The "Family Hub Updated" push notif now fires when
            GitHub Pages has actually finished deploying, not on push,
            so the buzz arrives once the new version is live.
  v5.3.0 - Three changes to the shopping/to-do experience:
            (1) The auto-detected category tag has moved out of the
            meta row and now sits directly below the camera/photo on
            the right edge of the item row, in a small column flush
            against the X delete button. Both the camera and tag are
            unchanged in size — they're just stacked, so the meta
            line (name + urgency + qty) no longer competes with the
            tag for attention. Legacy items that were saved with no
            cat fall back to "Other" automatically (no data
            migration). (2) The auto-categorisation keyword list got
            another large expansion across produce / dairy / bakery /
            meat / drinks / household / store-cupboard — including
            specific UK supermarket brand names (cereals like
            Weetabix / Cheerios / Kellogg's, biscuits like Oreo /
            McVitie's / Jaffa Cakes, sweets like Haribo / Maltesers /
            Smarties, chocolate brands like Cadbury / Galaxy / Lindt,
            crisp brands like Walkers / Pringles / Doritos, drink
            brands like PG Tips / Tropicana / Stella, household
            brands like Persil / Domestos / Colgate, etc.) so far
            more typed items get classified correctly straight away.
            Anything that still doesn't match any category is now
            auto-tagged "Other" instead of being left untagged, so
            every shopping item consistently shows a tag. (3)
            Type-ahead
            suggestions: as you type a new item (>=2 chars), up to 3
            chips appear above the priority row showing past entries
            whose name contains the typed substring, ranked by how
            many times they've been added. Tap a chip to fill the
            input — you can still adjust qty / urgency before
            submitting. The frequency counter is per-tab (shopping
            vs to-do), is stored in Firebase under itemHistory, and
            syncs across all family devices, so suggestions survive
            "Clear all done" cleanouts. Counts start accumulating
            from this version; existing items in your list don't
            retroactively count toward history.
  v5.2.1 - Added workflow_dispatch trigger to notify-on-deploy.yml so
            the deploy push-notification can be manually re-fired from
            the GitHub Actions tab without needing a fresh push (useful
            for verifying CFH_SYS_KEY config changes). No app behaviour
            change.
  v5.2.0 - Backend security hardening (no visible UX change):
            (1) /subscriptions in Firebase is no longer publicly
            readable. Before, anyone with the DB URL could list
            every device's push endpoint; now reads of that path
            require the database secret. Worker and the daily GC
            workflow both authenticate via FB_AUTH (worker uses
            a Cloudflare Workers Secret; GC workflow uses a
            GitHub Actions secret). The /cheema path remains
            readable so the app keeps working without changes.
            (2) The VAPID web-push private key is no longer
            hardcoded in the worker source — it lives in a
            Cloudflare Workers Secret (VAPID_PRIV) and the
            worker reads it via env. Same key as before, so all
            existing push subscriptions keep working; the source
            file just no longer contains the secret in
            plaintext. (3) The push worker now refuses
            unauthenticated callers. POST / and POST /photo only
            accept requests where Origin is the PWA origin
            (https://j-c-81.github.io), or where Authorization
            is "Bearer <CFH_SYS_KEY>" (used by the deploy-notify
            GitHub Action). Random scanners or anyone hitting
            the worker URL without those now get 403 instead of
            being able to spam the family with fake notifs. The
            public photo GET endpoint stays open so existing
            <img src> URLs keep loading.
  v5.1.1 - Partial revert of v5.1.0's item row rework based on
            user feedback: (1) the auto-detected category tag is
            back in the meta row with its previous text-only look
            (no surf2 background, no border, muted faded) — it
            no longer sits as a chip under the camera; (2) the
            "20h ago" timestamp is removed entirely from active
            items (done items still show "by <name>" attribution
            in the same slot); (3) the typed quantity flow is
            reverted — leading "2 milk" / trailing "milk x4"
            parsing is gone, the ×N tap-to-edit chip and inline
            numeric input are gone, and the previous − value +
            stepper inside the meta row is restored (tap-only,
            no typing). Done shopping items keep their read-only
            ×N badge when qty>1. No data migration: existing
            items with qty already set keep working unchanged.
  v5.1.0 - Item rows reworked across three concerns: (1) the
            "20h ago" timestamp on shopping/to-do items is now
            shrunk to 9px and faded to ~50% opacity so it stays
            available at a glance but no longer competes with
            name + urgency for attention (the underlying ts is
            unchanged); (2) the auto-detected category tag has
            moved out of the meta row and into a small chip
            stacked under the camera/photo on the right edge of
            the item — the category and the item visual now
            cluster together instead of cluttering the meta line;
            (3) quantity is no longer a − N + stepper inline.
            Instead: when adding an item, leading "2 milk",
            "3x bread", or trailing "milk x4" is parsed out and
            sets qty automatically (capped 1–99); on existing
            items a small ×N chip appears in the meta row, and
            tapping it swaps in an inline numeric input
            (Enter/blur to commit, Esc to cancel). When qty is
            still 1 the chip shows as a faded dashed "×1" so
            there's an obvious tap target to bump the count; once
            >1 it's a normal solid chip. Done items keep the ×N
            chip read-only (no edit). No data migration: existing
            items with qty already set keep working unchanged.
            previously had wide-open ".read: true, .write: true"
            rules, meaning anyone with the URL could DELETE the
            entire family hub. New rules:
              - /cheema: any write must include a non-null
                updatedAt field (which fbWrite always sets), so
                anonymous DELETE / and PUT null both fail with
                "Permission denied" while normal saves continue
                to work.
              - /subscriptions/<key>: still writable so push
                subscribe + worker cleanup keep working without
                code changes.
            No app-side change required; the existing fbWrite
            already conforms. Subscription endpoints remain
            publicly readable for now (low-severity vs the wipe
            risk).
  v5.0.0 - Milestone bump in recognition of the substantial
            backend overhaul shipped across v4.5.8 → v4.5.10:
            iPhone push reliability fixed, lost-write race fixed
            with read-merge-write save, polling architecture
            rebuilt (cheap updatedAt-first poll + pauses while
            backgrounded), service worker now caches the PWA shell
            for true offline boot, daily subscription garbage
            collection, dead Telegram config path removed, and
            photos migrated out of Firebase into Workers KV via a

            looks and behaves the same — this is a structural
            re-baseline, not a redesign. (No code changes vs.
            v4.5.10; this entry exists to make the major-bump
            explicit in the changelog.)
  v4.5.10 - Photos no longer get crammed inline as base64 inside the
            Firebase data on every save. The Cloudflare worker now has
            a /photo upload endpoint backed by Workers KV; addPhoto
            still shows the captured image instantly (base64), then
            uploads in the background and swaps the item's photo
            field to a small URL on success. Old base64 photos keep
            working unchanged. Result: every poll/save stays small
            even as photos accumulate, and the live image is served
            with year-long cache-control headers from the edge. No
            visible change to how adding/viewing photos feels. Also a
            small worker tidy: message bodies are no longer logged in
            Cloudflare (only the title/who), so notification contents
            don't sit in observability logs.
  v4.5.9 - Race-safe save: before writing the full state to Firebase,
            the client now re-reads remote and merges any concurrent
            additions from other devices by item id, so two people
            adding things at the same time no longer overwrites each
            other (the previous full-state PUT had a 5s race window
            where one save could clobber another's add). Also:
            sleeker quantity stepper: now an inline minimal − value +
            control inside the meta row instead of a chunky bordered
            column, so it doesn't crowd the photo / delete buttons.
            Hugely expanded auto-category keyword list — dairy
            especially (yoghurt, ghee, paneer, cheddar, brie, feta,
            mozzarella, parmesan, halloumi, ricotta, cream cheese,
            sour cream, almond/oat/soy/coconut milk, ice cream,
            kefir, lassi, dahi, paneer, etc.) plus heavy expansions
            for produce (aubergine, courgette, kale, ginger, mango,
            pineapple, etc.), bakery (naan, chapati, roti, paratha,
            pita, croissant, scone, etc.), meat (prawns, bacon, ham,
            chorizo, kebab, etc.), drinks (lemonade, smoothie,
            cappuccino, etc.), tins (lentils, chickpeas, garam
            masala, peanut butter, olives, etc.) and household
            (toothpaste, detergent, nappies, kitchen roll, etc.) —
            so far more shopping items now auto-file into the right
            category. Backend tidy-ups (no visible UX change):
            polling now does a tiny GET for just `/cheema/updatedAt`
            first and only re-downloads the full state when something
            actually changed (saves a lot of bandwidth, especially
            with photos in the messages feed); polling fully pauses
            while the app is in the background and resumes with an
            immediate refresh on return; the unused/dead Telegram
            config fetch was removed; the service worker now
            pre-caches manifest + icons for true offline shell boot
            (index.html stays network-first so version bumps roll
            out instantly); and a new daily GitHub Action prunes
            push subscription records that haven't been refreshed in
            30 days (skips records without a refreshedAt so existing
            entries from before v4.5.8 are preserved).
  v4.5.8 - Shopping items now have a quantity stepper (− value +)
            so you can track how many of each item you need; defaults
            to 1 and persists across devices via Firebase. Done items
            show a "×N" badge instead of the stepper. Also hardened
            push notifications on iPhone PWA: (a) initPush now
            re-creates a fresh push subscription whenever iOS has
            invalidated the old one (previously it only re-saved an
            existing sub, so once iOS dropped it the device went
            silently dead until the user manually tapped Enable),
            (b) refreshes on every app foreground via
            visibilitychange, and (c) the service worker now uses a
            unique tag per notification (cfh-<timestamp>) so iOS no
            longer dedupes rapid bursts into a single silent
            notification.
  v4.5.7 - Backfilled v4.5.1, v4.5.2, v4.5.3 entries below that
            had been missed at the time, so the changelog now matches
            the git tag history.
  v4.5.6 - Fixed self-notifications: when a family member switched
            login (or someone else used your device, then you logged
            back in) without reloading, the Firebase subscription
            record kept the OLD member name, so the relay's
            self-exclusion filter didn't match and the device pinged
            on its own user's actions. selectMember now re-PUTs the
            subscription with the current member whenever push
            permission is already granted, so the FB record always
            reflects who is actually logged in.
  v4.5.5 - Fixed Notify on Deploy GitHub Action that had been silently
            failing on every push (its grep matched both the example
            'vX.X.X' in the rules section and the real const VER,
            producing a multi-line value that broke $GITHUB_OUTPUT);
            now anchors the regex to start-of-line and takes only the

  v4.5.4 - Added auto-synced "CURRENT VERSION" marker at the top of
            this comment block (kept in sync with const VER by
            .github/workflows/sync-version.yml) so AI assistants always
            recognise the actual current version instead of inferring
            it from a possibly-stale changelog.
  v4.5.3 - Tap on item does nothing; short horizontal swipe on a row
            switches tabs (in the correct direction); long swipe still
            deletes — disambiguating the gesture overlap.
  v4.5.2 - Short swipe on an item switches tabs, long swipe deletes
            (replacing the previous all-or-nothing swipe behaviour).
  v4.5.1 - Fixed pull-to-refresh accidentally firing on tab swipe,
            item swipe taking priority over scroll, and pull state
            not cancelling when the active tab changed.
  v4.5.0 - Auto "What's New" overlay reads changelog from this comment
            block (no extra constants to maintain), GitHub Action sends
            push notification to all subscribers the instant a deploy
            goes live, dramatically enhanced pull-to-refresh with
            bigger scale, extra haptic bursts and quadruple flash finish
  v4.3.1 - Fixed swipe-to-delete (no longer conflicts with scrolling),
            new pull-to-refresh: arc spinner with pull/release/done states
  v4.3.0 - Real slide transition between tabs (cloned ghost pane),
            longer pull-to-refresh (1400ms min) with smoother spring,
            reworked swipe-to-delete: axis-lock so it no longer fights
            vertical scroll, 35%-width threshold, rubber-band release,
            edge-anchored tab swipes that reach the very screen edges,
            multi-select filters (any combo of members + categories),
            fixed "Reset to defaults" actually resets sort too,
            update-detected popup on first open after version change,
            install-to-home-screen popup for new visitors (iOS/Android
            auto-detected), push notifications now exclude sender's own
            registered devices via addedBy field (worker already
            supported this; client was not sending it), batch-add
            notification debounce extended to 8s so rapid adds group
            into a single push, keyboard focus hardened in Messages.
  v4.2.1 - Restored Claude Code version: filter sheet, SVG icons,
            light theme default, correct dark mode (:root.dark),
            pull-to-refresh (900ms min), undo tick (4.5s toast),

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none;transition:background .3s var(--ease),color .3s var(--ease)}
button,input,textarea,select{font-family:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted)}
::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100dvh}
.screen.active{display:flex;flex-direction:column}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ptr-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ptr-loading{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes itemIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}60%{box-shadow:0 0 0 6px transparent}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes loadfill{from{width:0}to{width:75%}}
@keyframes ptr-spin{to{transform:rotate(360deg) scale(1)}}
@keyframes ptr-pulse{0%,100%{opacity:1}50%{opacity:.55}}
#loading{align-items:center;justify-content:center;flex-direction:column;gap:18px}

.load-label{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.3px}
.load-bar{width:140px;height:3px;background:var(--brd);border-radius:99px;overflow:hidden;margin-top:4px}
.load-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#818cf8);border-radius:99px;animation:loadfill 1.2s ease both}

.glow-a,.glow-b{position:fixed;pointer-events:none;border-radius:50%}

.glow-b{bottom:-15%;right:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(129,140,248,.07) 0%,transparent 70%)}

.brand-name{font-size:17px;font-weight:800;letter-spacing:-.5px}
.brand-sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.divider{height:1px;background:var(--brd);margin:0 0 18px}
.who-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:11px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

function buildPollCompose(){const opts=pollOpts.map((o,i)=>`<div class="poll-opt-row"><input class="poll-opt-input" placeholder="Option ${i+1}" value="${esc(o)}" oninput="pollOpts[${i}]=this.value">${pollOpts.length>2?`<button class="poll-opt-rm" onclick="pollOpts.splice(${i},1);renderContent()">×</button>`:''}</div>`).join('');return`<div class="poll-compose" style="margin:8px 12px 0"><input class="poll-q-input" id="poll-q" placeholder="Ask the family something…" value="${esc(pollQ)}" oninput="pollQ=this.value">${opts}<div class="poll-actions">${pollOpts.length<4?`<button class="poll-add-opt" onclick="pollOpts.push('');renderContent()">+ Option</button>`:''}<button class="poll-submit" style="background:${TABS[2].accent}" onclick="postPoll()">Post Poll</button><button class="poll-cancel" onclick="showPollCompose=false;pollOpts=['',''];pollQ='';renderContent()">Cancel</button></div></div>`;}
function postPoll(){const q=(pollQ||'').trim(),opts=pollOpts.filter(o=>o.trim());if(!q||opts.length<2)return;const poll={id:genId(),q,opts:opts.map(o=>({text:o,votes:{}})),author:member,ts:Date.now(),type:'poll'};state.notes=[poll,...state.notes];showPollCompose=false;pollOpts=['',''];pollQ='';renderContent();save();queueNotif('msg',member,q);}
function votePoll(nid,oi){state.notes=state.notes.map(n=>{if(n.id!==nid||n.type!=='poll')return n;const opts=n.opts.map(o=>{const v={...(o.votes||{})};delete v[member];return{...o,votes:v};}).map((o,i)=>i===oi?{...o,votes:{...(o.votes||{}),[member]:true}}:o);return{...n,opts};});haptic(10);renderContent();save();}
function renderPollBubble(n,auth,isMe){const total=n.opts.reduce((s,o)=>s+Object.keys(o.votes||{}).length,0);const myV=n.opts.findIndex(o=>(o.votes||{})[member]);const opts=n.opts.map((o,i)=>{const cnt=Object.keys(o.votes||{}).length,pct=total?Math.round(cnt/total*100):0,voted=myV===i;return`<div class="poll-option${voted?' voted':''}" style="color:${voted?auth.color:'var(--sub)'}" onclick="votePoll('${n.id}',${i})"><div class="poll-bar" style="width:${pct}%;background:${auth.color}"></div><div class="poll-inner"><span>${esc(o.text)}${voted?' ✓':''}</span><span class="poll-pct">${total?pct+'%':''}</span></div></div>`;}).join('');return`<div class="nwrap ${isMe?'mine':'theirs'}"><div class="nhdr" style="flex-direction:${isMe?'row-reverse':'row'}"><div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div><span class="nauthor" style="color:${auth.color}">${esc(n.author)}</span><span class="ntime">${timeAgo(n.ts)}</span></div><div class="nbubble ${isMe?'mine':'theirs'}" style="min-width:200px;background:${isMe?auth.color+'18':'var(--surf2)'};border-color:${isMe?auth.color+'44':'var(--brd)'}${!isMe?`;border-left-color:${auth.color}88`:''}"><div class="poll-question">${n.pinned?`<span style="color:#f59e0b;font-size:10px;margin-right:6px;display:inline-flex;align-items:center;gap:3px;vertical-align:middle">${iconSvg('pin',10)}PINNED</span>`:''}${esc(n.q)}</div>${opts}<div class="poll-voters">${total} vote${total!==1?'s':''}</div></div><div style="display:flex;gap:10px;${isMe?'flex-direction:row-reverse':''}"><button class="ndel" onclick="togglePinPoll('${n.id}')">${n.pinned?'Unpin':'Pin'}</button>${isMe?`<button class="ndel" onclick="delNote('${n.id}')">Delete poll</button>`:''}</div></div>`;}
function togglePinPoll(nid){state.notes=state.notes.map(n=>n.id!==nid?n:{...n,pinned:!n.pinned});haptic(8);renderContent();save();}
function showPicker(e,nid){e.stopPropagation();document.querySelectorAll('.epicker').forEach(p=>p.remove());if(openPicker===nid){openPicker=null;return;}openPicker=nid;const p=document.createElement('div');p.className='epicker';p.innerHTML=EMOJIS.map(em=>`<button class="eopt" onclick="toggleRx('${nid}','${em}');closePicker()">${em}</button>`).join('');document.getElementById('rb'+nid)?.appendChild(p);setTimeout(()=>document.addEventListener('click',closePicker,{once:true}),10);}
function closePicker(){document.querySelectorAll('.epicker').forEach(p=>p.remove());openPicker=null;}
function toggleRx(nid,emoji){closePicker();haptic(8);state.notes=state.notes.map(n=>{if(n.id!==nid)return n;const rx={...(n.reactions||{})},who=[...(rx[emoji]||[])];const idx=who.indexOf(member);if(idx>=0)who.splice(idx,1);else who.push(member);if(!who.length)delete rx[emoji];else rx[emoji]=who;return{...n,reactions:rx};});renderContent();save();}
function showUndoToast(msg,onUndo){document.querySelector('.undo-toast')?.remove();const t=document.createElement('div');t.className='undo-toast';t.innerHTML=`<span class="undo-txt">${msg}</span><button class="undo-btn" onclick="this.closest('.undo-toast')._undo()">Undo</button>`;t._undo=()=>{clearTimeout(undoTimer);t.remove();onUndo();};document.body.appendChild(t);undoTimer=setTimeout(()=>t.remove(),4500);}
function addPhoto(itemId){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const canvas=document.createElement('canvas'),img=new Image();img.onload=()=>{const MAX=320,ratio=Math.min(MAX/img.width,MAX/img.height,1);canvas.width=img.width*ratio;canvas.height=img.height*ratio;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const b64=canvas.toDataURL('image/jpeg',0.75);const k=tabIdx===0?'shop':'todo';state[k]=state[k].map(i=>i.id===itemId?{...i,photo:b64}:i);renderContent();save();canvas.toBlob(async blob=>{if(!blob)return;try{const res=await fetch(PUSH_RELAY+'/photo',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});if(!res.ok)return;const d=await res.json();if(d&&d.url){state[k]=state[k].map(i=>i.id===itemId&&i.photo===b64?{...i,photo:d.url}:i);renderContent();save();}}catch(err){}},'image/jpeg',0.75);};img.src=URL.createObjectURL(file);};inp.click();}
function attachMsgImage(){if(pendingMsgUploading)return;const inp=document.createElement('input');inp.type='file';inp.accept='image/gif,image/png,image/jpeg,image/webp,image/*';inp.onchange=async e=>{const file=e.target.files[0];if(!file)return;const isGif=(file.type==='image/gif')||/\.gif$/i.test(file.name||'');const ta=document.getElementById('ni'),tasaved=ta?ta.value:'';let blob;if(isGif){blob=file;}else{try{const url=URL.createObjectURL(file);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});const MAX=720,ratio=Math.min(MAX/img.width,MAX/img.height,1);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));}catch(err){blob=file;}}pendingMsgUploading=true;pendingMsgImage=URL.createObjectURL(blob);renderContent();const taAfter=document.getElementById('ni');if(taAfter&&tasaved)taAfter.value=tasaved;setStatus('saving');try{const res=await fetch(PUSH_RELAY+'/photo',{method:'POST',headers:{'Content-Type':blob.type||(isGif?'image/gif':'image/jpeg')},body:blob});if(!res.ok)throw new Error('upload');const d=await res.json();if(!d||!d.url)throw new Error('no url');pendingMsgImage=d.url;pendingMsgUploading=false;setStatus('live');const ta2=document.getElementById('ni'),tasaved2=ta2?ta2.value:'';renderContent();const ta3=document.getElementById('ni');if(ta3&&tasaved2)ta3.value=tasaved2;}catch(err){pendingMsgUploading=false;pendingMsgImage=null;setStatus('error');renderContent();}};inp.click();}
function cancelMsgImage(){pendingMsgImage=null;pendingMsgUploading=false;renderContent();}
function viewPhoto(b64){const m=document.createElement('div');m.className='photo-modal';m.innerHTML=`<img src="${b64}"><button class="photo-modal-close" onclick="this.parentElement.remove()">✕</button>`;m.onclick=e=>{if(e.target===m)m.remove();};document.body.appendChild(m);}
function addItem(){const inp=document.getElementById('mi'),raw=inp?.value.trim();if(!raw)return;const isS=tabIdx===0,urg=isS?shopUrg:todoUrg;const text=raw;const autoCat=isS?suggestCat(text):'';const it={id:genId(),text,urgency:urg,cat:autoCat,addedBy:member,done:false,ts:Date.now()};if(isS)it.qty=1;if(isS)state.shop=[it,...state.shop];else state.todo=[it,...state.todo];if(isS){shopUrg=0;}else{todoUrg=0;}state.itemHistory=state.itemHistory||{shop:{},todo:{}};const histKey=isS?'shop':'todo';state.itemHistory[histKey]=state.itemHistory[histKey]||{};const histK=text.toLowerCase();state.itemHistory[histKey][histK]=(state.itemHistory[histKey][histK]||0)+1;inp.value='';shouldFocus=true;haptic(8);renderTabs();renderContent();save();queueNotif(isS?'shop':'todo',member,text);}
function setQty(e,id,delta){if(e){e.stopPropagation();}haptic(6);state.shop=state.shop.map(i=>i.id!==id?i:{...i,qty:Math.max(1,(i.qty||1)+delta)});renderContent();save();}
function setUrg(i){const inp=document.getElementById('mi'),saved=inp?inp.value:'';if(tabIdx===0)shopUrg=i;else todoUrg=i;renderContent();const mi=document.getElementById('mi');if(mi&&saved){mi.value=saved;mi.focus();}}
function cycleUrg(e,id){e.stopPropagation();haptic(8);const k=tabIdx===0?'shop':'todo';state[k]=state[k].map(i=>i.id!==id?i:{...i,urgency:((i.urgency??0)+1)%3});renderContent();save();}
function toggleItem(id){haptic([8,20,8]);const k=tabIdx===0?'shop':'todo';const it=state[k].find(i=>i.id===id);if(!it)return;const nowDone=!it.done;state[k]=state[k].map(i=>i.id===id?{...i,done:nowDone,doneBy:nowDone?member:undefined}:i);if(nowDone){showUndoToast(`Ticked off "${it.text.slice(0,28)}"`,()=>{state[k]=state[k].map(i=>i.id===id?{...i,done:false,doneBy:undefined}:i);renderTabs();renderContent();save();});}renderTabs();renderContent();save();}
function delItem(id){const k=tabIdx===0?'shop':'todo';state[k]=state[k].filter(i=>i.id!==id);renderTabs();renderContent();save();}
function clearDone(){const k=tabIdx===0?'shop':'todo';state[k]=state[k].filter(i=>!i.done);renderTabs();renderContent();save();}
function postNote(){const inp=document.getElementById('ni');const text=(inp?.value||'').trim();const image=pendingMsgUploading?null:pendingMsgImage;if((!text&&!image)||!inp)return;inp.value='';inp.focus();const note={id:genId(),text,author:member,ts:Date.now(),reactions:{}};if(image)note.image=image;state.notes=[note,...state.notes];pendingMsgImage=null;pendingMsgUploading=false;haptic(8);const feed=document.querySelector('.msg-feed');if(feed){const auth=getMem(member);const div=document.createElement('div');div.className='nwrap mine';div.style.cssText='animation:itemIn .2s var(--ease) both';const imgHTML=image?`<img class="nimg" src="${esc(image)}" onclick="viewPhoto('${esc(image)}')">`:'';const textHTML=text?`<div class="ntext">${esc(text)}</div>`:'';div.innerHTML=`<div class="nhdr" style="flex-direction:row-reverse"><div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div><span class="nauthor" style="color:${auth.color}">${esc(member)}</span><span class="ntime">just now</span></div><div class="nbubble mine${image&&!text?' img-only':''}" style="background:${auth.color}18;border-color:${auth.color}44">${imgHTML}${textHTML}</div><div class="nbottom"><button class="ndel" onclick="delNote('${note.id}')">Delete</button><div class="rbar" id="rb${note.id}"><button class="radd" onclick="showPicker(event,'${note.id}')">+</button></div></div>`;feed.insertBefore(div,feed.firstChild);feed.querySelector('.empty')?.remove();const prev=document.querySelector('.msg-preview');if(prev)prev.remove();}requestAnimationFrame(()=>{const again=document.getElementById('ni');if(again)again.focus();});save();queueNotif('msg',member,text||'(image)');renderTabs();}
function delNote(id){state.notes=state.notes.filter(n=>n.id!==id);renderContent();save();}
function setFilter(n){const arr=tabIdx===0?shopFilters:todoFilters;if(n==='All'){arr.length=0;}else{const i=arr.indexOf(n);if(i>=0)arr.splice(i,1);else arr.push(n);}renderContent();if(filterSheetOpen)renderFilterSheetContent();}
function hasActiveFilters(){if(tabIdx===0)return shopFilters.length>0||shopCats.length>0||shopSort!=='recency-desc';if(tabIdx===1)return todoFilters.length>0||todoSort!=='urgency-desc';return false;}
function openFilterSheet(){filterSheetOpen=true;renderFilterSheetContent();document.getElementById('fsheet').classList.add('open');document.getElementById('fsheet-back').classList.add('open');}
function closeFilterSheet(){filterSheetOpen=false;document.getElementById('fsheet').classList.remove('open');document.getElementById('fsheet-back').classList.remove('open');}
function clearFilters(){if(tabIdx===0){shopFilters.length=0;shopCats.length=0;shopSort='recency-desc';}else if(tabIdx===1){todoFilters.length=0;todoSort='urgency-desc';}renderContent();renderFilterSheetContent();}
function renderFilterSheetContent(){const sheet=document.getElementById('fsheet');if(!sheet)return;if(tabIdx>=2){sheet.innerHTML='';return;}const isS=tabIdx===0,filters=isS?shopFilters:todoFilters,sort=isS?shopSort:todoSort,acc=TABS[tabIdx].accent;const pills=['All',...MEMBERS.map(x=>x.name)].map(n=>{const mx=n==='All'?null:getMem(n),active=n==='All'?filters.length===0:filters.includes(n),col=mx?mx.color:acc;return`<button class="f-btn" onclick="setFilter('${n}')" style="border-color:${active?col:'var(--brd)'};background:${active?col+'18':'transparent'};color:${active?col:'var(--muted)'}">${mx?`<div class="av" style="width:12px;height:12px;font-size:5.5px;color:${mx.color};background:${mx.color}18;border:1px solid ${mx.color}44;border-radius:30%">${mx.initials}</div>`:''}${esc(n)}</button>`;}).join('');const catPills=isS?['All',...CATS.map(c=>c.id)].map(cid=>{const ci=CATS.find(c=>c.id===cid),active=cid==='All'?shopCats.length===0:shopCats.includes(cid);return`<button class="f-btn" onclick="setCat('${cid}')" style="border-color:${active?acc:'var(--brd)'};background:${active?acc+'18':'transparent'};color:${active?acc:'var(--muted)'}">${cid==='All'?'All':ci.label}</button>`;}).join(''):'';sheet.innerHTML=`<div class="fsheet-grip"></div><div class="fsheet-hdr"><div class="fsheet-title">Filter &amp; Sort</div><button class="fsheet-done" onclick="closeFilterSheet()">Done</button></div><div class="fsheet-sec"><div class="fsheet-lbl">Sort by</div><select class="sort-sel" style="color:${acc};border-color:${acc}44" onchange="setSort(this.value)">${SORTS.map(o=>`<option value="${o.key}"${sort===o.key?' selected':''}>${o.label}</option>`).join('')}</select></div><div class="fsheet-sec"><div class="fsheet-lbl">Show items from</div><div class="fsheet-pills">${pills}</div></div>${isS?`<div class="fsheet-sec"><div class="fsheet-lbl">Category</div><div class="fsheet-pills">${catPills}</div></div>`:''}${hasActiveFilters()?`<button class="fsheet-clear" onclick="clearFilters()">Reset to defaults</button>`:''}`;}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent);}
function renderInstallBanner(){}
function checkVersionUpdate(){
  const last=localStorage.getItem('cfh-last-ver');
  if(last!==VER){
    localStorage.setItem('cfh-last-ver',VER);
    if(last){setTimeout(()=>showUpdatePopup(last),900);try{retagOthers();}catch(e){}}
  }
}
function retagOthers(){if(!state||!Array.isArray(state.shop)||!state.shop.length)return;let changed=false;state.shop=state.shop.map(it=>{if(it&&it.cat==='other'&&it.text){const n=suggestCat(it.text);if(n&&n!=='other'){changed=true;return{...it,cat:n};}}return it;});if(changed){renderContent();save();}}
async function showUpdatePopup(prevVer){
  if(document.querySelector('.app-popup-back'))return;
  let notes='';
  try{
    const r=await fetch(location.href,{cache:'no-store'});
    const html=await r.text();
    const re=new RegExp(VER.replace(/[.]/g,'\\.')+'\\s*-\\s*([\\s\\S]*?)(?=\\n  v\\d|={3,})');
    const m=html.match(re);
    if(m)notes=m[1].replace(/\n\s{10,}/g,' ').trim();
  }catch(e){}
  if(!notes)notes='New improvements and fixes';
  const bullets=notes.split(/,\s*(?=[A-Z"])/).map(s=>s.trim()).filter(Boolean).map(s=>'• '+s).join('<br>');
  const back=document.createElement('div');
  back.className='app-popup-back';
  back.innerHTML=`<div class="app-popup"><div class="app-popup-ico">✨</div><div class="app-popup-title">What's New</div><div class="app-popup-sub">${esc(prevVer)} → ${VER}</div><div class="app-popup-body">${bullets}</div><button class="app-popup-btn" onclick="this.closest('.app-popup-back').remove()">Got it</button></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
}
function checkInstallPrompt(){
  if(isStandalone())return;
  if(localStorage.getItem('cfh-install-seen'))return;
  localStorage.setItem('cfh-install-seen','1');
  setTimeout(showInstallPopup,2200);
}
function showInstallPopup(){
  if(document.querySelector('.app-popup-back'))return;
  const ios=isIOS();
  const steps=ios
    ?[['1','Tap the <b>Share</b> button at the bottom of Safari'],['2','Scroll down and tap <b>Add to Home Screen</b>'],['3','Tap <b>Add</b> — the app will appear on your home screen']]
    :[['1','Tap the menu (<b>⋮</b>) in Chrome'],['2','Tap <b>Install app</b> or <b>Add to Home screen</b>'],['3','Open it from your home screen like any app']];
  const stepsHTML=steps.map(s=>`<div class="app-popup-step"><div class="app-popup-step-n">${s[0]}</div><div>${s[1]}</div></div>`).join('');
  const back=document.createElement('div');
  back.className='app-popup-back';
  back.innerHTML=`<div class="app-popup"><div class="app-popup-ico">📱</div><div class="app-popup-title">Install as an app</div><div class="app-popup-sub">${ios?'iOS / Safari':'Android / Chrome'}</div><div class="app-popup-steps">${stepsHTML}</div><button class="app-popup-btn" onclick="this.closest('.app-popup-back').remove()">Got it</button><button class="app-popup-dismiss" onclick="this.closest('.app-popup-back').remove()">Maybe later</button></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
}
async function initPush(){if(!('serviceWorker' in navigator)||!('PushManager' in window))return;if(Notification.permission!=='granted')return;try{if(!swReg)swReg=await navigator.serviceWorker.register('/cheema-family-hub/sw.js',{scope:'/cheema-family-hub/'});await navigator.serviceWorker.ready;let sub=await swReg.pushManager.getSubscription();if(!sub){try{sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});}catch(e){return;}}const key=sub.endpoint.split('/').pop().replace(/[^a-zA-Z0-9]/g,'').slice(-20)||'sub'+Date.now();await fetch(`https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/subscriptions/${key}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...sub.toJSON(),member,refreshedAt:Date.now()})});}catch(e){}}
function initTabSwipe(){
  if(document._tsb)return;
  document._tsb=true;
  const EDGE_PX=28;
  let sx=0,sy=0,active=false,decided=false,fromEdge=false;
  // Items handle their own short-swipe tab switch, so exclude them here to avoid double-firing
  const ignoreSel='.swipe-outer,.item,.swipe-wrap,.filter-row,.urg-row,.cat-row,.poll-option,.input-card,.msg-compose,.fsheet,.app-popup-back,.photo-modal,textarea,input,select';
  document.addEventListener('touchstart',e=>{
    active=false;decided=false;fromEdge=false;
    const app=document.getElementById('app');
    if(!app||!app.classList.contains('active'))return;
    if(filterSheetOpen||transitioning)return;
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;
    fromEdge=(sx<EDGE_PX)||(sx>window.innerWidth-EDGE_PX);
    if(!fromEdge&&e.target.closest(ignoreSel))return;
    active=true;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!active)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!decided&&(Math.abs(dx)>8||Math.abs(dy)>8)){
      decided=true;
      const tol=fromEdge?1.1:.8;
      if(Math.abs(dy)>Math.abs(dx)*tol)active=false;
    }
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!active)return;
    active=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    const minDx=fromEdge?40:60;
    if(Math.abs(dx)<minDx||Math.abs(dy)>Math.abs(dx)*.65||transitioning)return;
    if(dx<0&&tabIdx<TABS.length-1)setTab(tabIdx+1);
    else if(dx>0&&tabIdx>0)setTab(tabIdx-1);
  },{passive:true});
}
async function init(){try{initTheme();}catch(e){}showScreen('loading');const cache=loadCache();if(cache){state=cache.state;}try{await initSW();}catch(e){}try{const d=await fbRead();state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices,itemHistory:d.itemHistory||{shop:{},todo:{}}};lastTs=d.updatedAt;cacheState();setStatus('live');setOffline(false);}catch(e){if(!cache){setStatus('error');renderLogin();showScreen('login');return;}setStatus('offline');setOffline(true);}try{renderLogin();const saved=localStorage.getItem('cfh_member');const ok=saved&&MEMBERS.find(m=>m.name===saved);if(ok){selectMember(saved);}else{showScreen('login');}startPoll();}catch(e){showScreen('login');}try{initPush();}catch(e){}try{checkVersionUpdate();}catch(e){}try{checkInstallPrompt();}catch(e){}window.addEventListener('online',()=>{setOffline(false);setStatus('live');save();});window.addEventListener('offline',()=>{setOffline(true);setStatus('offline');});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}else if(member){try{initPush();}catch(e){}if(!pollTimer)startPoll();(async()=>{try{const d=await fbRead();if(d.updatedAt>lastTs){lastTs=d.updatedAt;state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices,itemHistory:d.itemHistory||{shop:{},todo:{}}};cacheState();renderContent();renderTabs();}setOffline(false);}catch(e){setOffline(!navigator.onLine);}})();}});}
init();
