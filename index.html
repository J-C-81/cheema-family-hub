<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" id="tmeta" content="#060d18">
<title>Cheema Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --bg:#060d18;--surf:#0b1626;--surf2:#101f34;--surf3:#172845;
  --brd:#1d3050;--brd2:#2a426a;
  --text:#e6eeff;--sub:#6888b2;--muted:#2e4468;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 4px 24px rgba(0,0,0,.5);--shadow-lg:0 12px 48px rgba(0,0,0,.6);
  --r:14px;--r-lg:20px;--r-xl:24px;
}
body.light{
  --bg:#eef2ff;--surf:#fff;--surf2:#e4ecfa;--surf3:#d6e4f5;
  --brd:#c0d0ea;--brd2:#a8bedc;
  --text:#060d18;--sub:#4a6280;--muted:#90aac8;
  --shadow:0 4px 16px rgba(6,13,24,.08);--shadow-lg:0 12px 40px rgba(6,13,24,.12);
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none;transition:background .3s var(--ease),color .3s var(--ease)}
button,input,textarea,select{font-family:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted)}
::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100dvh}
.screen.active{display:flex;flex-direction:column}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}60%{box-shadow:0 0 0 6px transparent}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── LOADING ── */
#loading{align-items:center;justify-content:center;flex-direction:column;gap:18px}
.load-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#60a5fa,#818cf8);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(96,165,250,.3);animation:scaleIn .4s var(--spring) both}
.load-label{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.3px}
.load-bar{width:140px;height:3px;background:var(--brd);border-radius:99px;overflow:hidden;margin-top:4px}
.load-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#818cf8);border-radius:99px;animation:loadfill 1.2s ease both}
@keyframes loadfill{from{width:0}to{width:75%}}

/* ── LOGIN ── */
#login{align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden}
.glow-a,.glow-b{position:fixed;pointer-events:none;border-radius:50%}
.glow-a{top:-20%;left:-15%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(96,165,250,.07) 0%,transparent 70%)}
.glow-b{bottom:-15%;right:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(129,140,248,.07) 0%,transparent 70%)}
.login-card{position:relative;z-index:1;background:var(--surf);border-radius:var(--r-xl);border:1px solid var(--brd);box-shadow:var(--shadow-lg);padding:28px 20px;width:100%;max-width:310px;animation:scaleIn .4s var(--spring) both}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#60a5fa,#818cf8);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(96,165,250,.28)}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.5px}
.brand-sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.divider{height:1px;background:var(--brd);margin:0 0 18px}
.who-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:11px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--r-lg);padding:16px 8px 13px;cursor:pointer;transition:border-color .18s,background .18s,transform .12s var(--ease),box-shadow .2s}
.mbtn:active{transform:scale(.93)}
.mname{font-size:12px;font-weight:600}
.av{border-radius:28%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;user-select:none;transition:transform .2s var(--spring)}

/* ── OFFLINE BANNER ── */
.offline-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#f59e0b;color:white;font-size:12px;font-weight:700;text-align:center;padding:8px;letter-spacing:.2px}
body.offline .offline-banner{display:block}
body.offline header{top:36px}

/* ── HEADER ── */
header{border-bottom:1.5px solid var(--brd);padding:11px 14px 0;position:sticky;top:0;z-index:100;transition:border-color .3s,top .2s}
body:not(.light) header{background:rgba(6,13,24,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
body.light header{background:rgba(238,242,255,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.h-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.h-icon{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s}
.h-meta{min-width:0}
.h-lbl{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;line-height:1}
.h-title{font-size:14px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.h-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.hbtn{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:1px solid var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform .15s var(--spring),background .3s;flex-shrink:0;color:var(--sub);position:relative}
.hbtn:active{transform:scale(.82)}
.hbtn .badge{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:1.5px solid var(--bg)}
.status-pill{display:flex;align-items:center;gap:3px;padding:3px 7px;background:var(--surf2);border-radius:20px;border:1px solid var(--brd)}
.sdot{width:5px;height:5px;border-radius:50%;transition:background .4s;animation:blink 4s infinite}
.stxt{font-size:9px;font-weight:600;color:var(--sub)}
.m-chip{display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--brd);border-radius:20px;padding:3px 9px 3px 4px;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.m-chip:active{opacity:.7}
.chip-name{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}


/* ── TABS ── */
.tabs-row{display:flex;align-items:flex-end}
.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 2px 10px;border:none;background:transparent;font-size:11.5px;font-weight:700;cursor:pointer;letter-spacing:-.1px;transition:color .2s var(--ease),background .2s;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;min-width:0}
.tab-icn{font-size:14px;line-height:1}
.tab-cnt{font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px;transition:all .2s;flex-shrink:0;min-width:16px;text-align:center}
.sort-wrap{padding:0 0 10px 6px;flex-shrink:0}
.sort-sel{padding:4px 8px;border-radius:8px;background:var(--surf2);font-size:10px;font-weight:700;outline:none;cursor:pointer;border-width:1.5px;border-style:solid;appearance:none;-webkit-appearance:none;transition:background .3s}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.accent-strip{height:2px;transition:background .3s}

/* ── PULL TO REFRESH ── */
.ptr{display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;transition:height .2s;font-size:11px;color:var(--muted);font-weight:600;gap:6px}
.ptr.show{height:44px}
.ptr-spin{width:14px;height:14px;border:2px solid var(--brd);border-top-color:var(--sub);border-radius:50%;animation:spin .6s linear infinite}

/* ── INPUT CARD ── */
.input-card{margin:12px 12px 0;background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);box-shadow:var(--shadow);transition:background .3s,border-color .3s;animation:fadeUp .25s var(--ease) both}
.input-row{display:flex;align-items:center;border-bottom:1px solid var(--brd)}
.main-input{flex:1;min-width:0;padding:13px 13px;border:none;background:transparent;font-size:15px;font-weight:500;outline:none;color:var(--text)}
.add-btn{margin:5px;padding:8px 15px;border-radius:10px;border:none;font-weight:700;font-size:13px;color:white;transition:transform .12s var(--ease),opacity .12s,background .25s;white-space:nowrap;flex-shrink:0;cursor:pointer}
.add-btn:active{transform:scale(.88);opacity:.85}
.urg-row{display:flex;align-items:center;gap:4px;padding:7px 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.urg-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;flex-shrink:0;margin-right:2px}
.urg-btn{display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-weight:600;font-size:11px;flex-shrink:0;transition:all .15s var(--ease);cursor:pointer;border-width:1.5px;border-style:solid;white-space:nowrap}
.urg-btn:active{transform:scale(.88)}
.udot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ── CATEGORIES ── */
.cat-row{display:flex;align-items:center;gap:4px;padding:0 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--brd)}
.cat-btn{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;cursor:pointer;transition:all .15s;border-width:1.5px;border-style:solid;white-space:nowrap}
.cat-btn:active{transform:scale(.9)}

/* ── FILTERS ── */
.filter-row{display:flex;align-items:center;gap:4px;padding:10px 12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.f-btn{display:flex;align-items:center;gap:3px;padding:4px 10px;border-radius:20px;flex-shrink:0;font-weight:600;font-size:11px;cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;border-width:1.5px;border-style:solid}
.f-btn:active{transform:scale(.91)}
.list-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
.list-hdr-txt{font-size:11px;color:var(--muted);font-weight:600}

/* ── ITEMS ── */
.list-wrap{padding:2px 12px 0}
.swipe-outer{position:relative;margin-bottom:6px;border-radius:var(--r);overflow:hidden;animation:itemIn .2s var(--ease) both}
.swipe-outer:nth-child(2){animation-delay:.04s}
.swipe-outer:nth-child(3){animation-delay:.07s}
.swipe-outer:nth-child(4){animation-delay:.10s}
.swipe-outer:nth-child(n+5){animation-delay:.13s}
.swipe-wrap{position:relative;background:#ef4444;border-radius:var(--r)}
.swipe-hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:white;font-size:12px;font-weight:700;pointer-events:none;display:flex;align-items:center;gap:4px}
.item{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:var(--r);padding:11px 12px;border:1px solid var(--brd);border-left-width:3px;position:relative;z-index:1;will-change:transform;touch-action:pan-y;transition:background .3s,border-color .3s}
.item.done{opacity:.28}
.ichk{width:22px;height:22px;border-radius:7px;border:1.5px solid;background:transparent;cursor:pointer;flex-shrink:0;padding:0;transition:all .18s var(--spring);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.ichk:active{transform:scale(.78)}
.ibody{flex:1;min-width:0}
.itext{font-size:14px;font-weight:500;color:var(--text);word-break:break-word;overflow-wrap:anywhere;line-height:1.4}
.itext.struck{text-decoration:line-through;color:var(--sub)}
.imeta{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.icat{font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;flex-shrink:0}
.iname{font-size:10px;font-weight:700;flex-shrink:0}
.iurg{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0;transition:opacity .14s}
.iurg:active{opacity:.6}
.itime{font-size:10px;color:var(--muted);font-weight:500}
.del-btn{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:3px;line-height:1;transition:color .14s,transform .14s;flex-shrink:0;opacity:.4}
.del-btn:active{color:#ef4444;opacity:1;transform:scale(1.2)}

/* ── DONE ── */
.done-sec{padding:0 12px}
.done-sep{height:1px;background:var(--brd);margin:8px 0 0}
.done-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 0 7px}
.done-ttl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.clear-btn{font-size:11px;font-weight:600;color:var(--sub);background:var(--surf2);border:1px solid var(--brd);cursor:pointer;padding:3px 8px;border-radius:7px;transition:opacity .14s}
.clear-btn:active{opacity:.7}

/* ── EMPTY ── */
.empty{text-align:center;padding:52px 24px 32px;animation:fadeUp .3s var(--ease) both}
.empty-icon{width:52px;height:52px;border-radius:16px;background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
.empty-title{font-size:15px;font-weight:700;color:var(--sub)}
.empty-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ── UNDO TOAST ── */
.undo-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surf3);border:1px solid var(--brd2);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);z-index:400;animation:slideUp .22s var(--spring) both;white-space:nowrap}
.undo-txt{font-size:13px;font-weight:600;color:var(--text)}
.undo-btn{font-size:12px;font-weight:700;color:#60a5fa;background:none;border:none;cursor:pointer;padding:2px 0}

/* ── NOTICE BOARD ── */
.notice-wrap{margin:11px 12px 0;animation:fadeUp .2s var(--ease) both}
.notice-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.notice-hdr-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.notice-add-btn{font-size:11px;font-weight:600;color:var(--sub);background:var(--surf2);border:1px solid var(--brd);padding:3px 9px;border-radius:7px;cursor:pointer}
.notice-item{background:var(--surf2);border:1px solid var(--brd);border-left:3px solid #f59e0b;border-radius:12px;padding:9px 11px;margin-bottom:5px;animation:itemIn .18s var(--ease) both}
.notice-text{font-size:13px;font-weight:500;color:var(--text);line-height:1.45;word-break:break-word}
.notice-meta{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.notice-author{font-size:10px;font-weight:700}
.notice-unpin{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;padding:1px 3px}
.notice-unpin:active{color:#ef4444}
.notice-compose{background:var(--surf);border:1.5px solid #f59e0b55;border-radius:12px;overflow:hidden;margin-bottom:5px}
.notice-compose textarea{width:100%;padding:10px 11px;border:none;background:transparent;font-size:13px;color:var(--text);resize:none;outline:none;line-height:1.5}
.notice-compose-ft{display:flex;justify-content:flex-end;gap:6px;padding:5px 10px 8px;border-top:1px solid var(--brd)}
.notice-compose-ft button{padding:5px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}

/* ── MESSAGES ── */
.msg-compose{margin:12px 12px 0;background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);border-top-width:2px;box-shadow:var(--shadow);transition:background .3s,border-color .3s;animation:fadeUp .25s var(--ease) both}
.msg-ta{width:100%;padding:12px 13px;border:none;background:transparent;font-size:14px;font-weight:500;outline:none;color:var(--text);resize:none;display:block;line-height:1.55;overflow-wrap:break-word;word-break:break-word;min-height:60px}
.msg-ft{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 9px;border-top:1px solid var(--brd);gap:8px}
.msg-as{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);font-weight:500;min-width:0;overflow:hidden}
.msg-actions{display:flex;gap:6px;flex-shrink:0}
.post-btn{padding:7px 15px;border-radius:10px;border:none;font-weight:700;font-size:12px;color:white;cursor:pointer;transition:transform .12s var(--ease),opacity .12s;white-space:nowrap}
.post-btn:active{transform:scale(.88);opacity:.85}
.msg-tool-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--brd);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s}
.msg-tool-btn:active{background:var(--surf3)}
.msg-feed{padding:12px 12px 0}
.nwrap{margin-bottom:16px;display:flex;flex-direction:column;animation:itemIn .2s var(--ease) both}
.nwrap.mine{align-items:flex-end}.nwrap.theirs{align-items:flex-start}
.nhdr{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.nauthor{font-size:12px;font-weight:800;letter-spacing:-.2px}
.ntime{font-size:10px;color:var(--muted);font-weight:500}
.nbubble{max-width:85%;padding:10px 13px;border:1px solid;overflow-wrap:break-word;word-break:break-word}
.nbubble.mine{border-radius:16px 4px 16px 16px}
.nbubble.theirs{border-radius:4px 16px 16px 16px;border-left-width:3px}
.ntext{font-size:14px;font-weight:500;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.rbar{display:flex;align-items:center;gap:3px;margin-top:5px;flex-wrap:wrap;position:relative}
.rbtn{display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:11px;background:var(--surf2);border:1px solid var(--brd);cursor:pointer;font-size:13px;transition:all .14s}
.rbtn:active{transform:scale(.87)}
.rcnt{font-size:10px;font-weight:700;color:var(--sub)}
.radd{padding:3px 8px;border-radius:11px;background:var(--surf2);border:1px solid var(--brd);cursor:pointer;font-size:11px;color:var(--muted);font-weight:600}
.epicker{display:flex;gap:3px;padding:5px;background:var(--surf);border:1px solid var(--brd);border-radius:13px;box-shadow:var(--shadow-lg);position:absolute;bottom:calc(100% + 6px);left:0;z-index:50;animation:fadeUp .12s var(--ease) both}
.eopt{font-size:18px;padding:3px 5px;border-radius:7px;cursor:pointer;background:none;border:none;transition:transform .1s}
.eopt:active{transform:scale(.78)}
.ndel{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:3px;font-weight:600;padding:1px 3px}
.ndel:active{color:#ef4444}

/* ── POLL ── */
.poll-compose{background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--r);padding:11px 12px;margin-bottom:9px;animation:fadeUp .18s var(--ease) both}
.poll-q-input{width:100%;padding:8px 10px;border:1px solid var(--brd);border-radius:8px;background:var(--surf3);font-size:13px;outline:none;margin-bottom:7px;color:var(--text)}
.poll-opt-row{display:flex;gap:5px;margin-bottom:5px}
.poll-opt-input{flex:1;padding:6px 9px;border:1px solid var(--brd);border-radius:8px;background:var(--surf3);font-size:12px;outline:none;color:var(--text)}
.poll-opt-rm{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 3px}
.poll-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.poll-add-opt{padding:6px 10px;border-radius:8px;border:1px dashed var(--brd);background:transparent;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer}
.poll-submit{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;color:white;cursor:pointer}
.poll-cancel{padding:6px 10px;border-radius:8px;border:1px solid var(--brd);font-size:11px;font-weight:600;color:var(--sub);background:var(--surf2);cursor:pointer}
.poll-question{font-size:14px;font-weight:700;color:var(--text);margin-bottom:9px}
.poll-option{margin-bottom:5px;cursor:pointer;border-radius:8px;overflow:hidden;position:relative;border:1.5px solid var(--brd);transition:all .15s}
.poll-bar{position:absolute;left:0;top:0;bottom:0;transition:width .4s ease;opacity:.16}
.poll-inner{position:relative;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:12px;font-weight:600}
.poll-pct{font-size:11px;font-weight:700;opacity:.7}
.poll-voters{font-size:10px;color:var(--muted);margin-top:4px}

/* ── PHOTOS ── */
.photo-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 3px;font-size:15px;flex-shrink:0}
.item-photo{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--brd)}
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .15s ease both}
.photo-modal img{max-width:100%;max-height:88vh;border-radius:12px;object-fit:contain}
.photo-modal-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:none;color:white;font-size:21px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── NOTIF BAR ── */
.notif-bar{margin:10px 12px 0;background:var(--surf2);border:1px solid var(--brd);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:8px;animation:fadeUp .2s var(--ease) both}
.notif-bar-txt{font-size:12px;color:var(--sub);font-weight:500;flex:1;min-width:0;line-height:1.4}
.notif-bar-act{padding:5px 10px;border-radius:8px;background:#60a5fa1a;border:1px solid #60a5fa44;color:#60a5fa;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.notif-bar-dis{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;flex-shrink:0}

/* ── FOOTER ── */
.footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 0 16px}
.fdot{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:blink 4s 2s infinite}
.ftxt{font-size:10px;color:var(--muted);font-weight:500}
.fver{font-size:10px;font-weight:700;color:var(--muted);background:var(--surf2);border:1px solid var(--brd);padding:2px 7px;border-radius:8px;margin-left:2px}
</style>
</head>
<body>

  <div class="ptr" id="ptr"><div class="ptr-spin"></div> Refreshing…</div>

</div>

<script>
// ── CONFIG ──
const FB='https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/cheema.json';
const VER='v5.0.0';
const PUSH_RELAY='https://cfh-push.jivancheemalfc.workers.dev'; // set to Cloudflare worker URL when available

const MEMBERS=[
  {name:'Mum',          initials:'M',color:'#f472b6'},
  {name:'Dad',          initials:'D',color:'#60a5fa'},
  {name:'Jiv',          initials:'J',color:'#fb923c'},
  {name:'Rajan(Midget)',initials:'R',color:'#a78bfa'},
];
const URGENCY=[
  {label:'Low',   color:'#22c55e',ring:'#4ade80'},
  {label:'Medium',color:'#eab308',ring:'#fde047'},
  {label:'High',  color:'#ef4444',ring:'#f87171'},
];
const TABS=[
  {key:'shop', label:'Shopping', icon:'🛒', accent:'#0ea5e9'},
  {key:'todo', label:'To-Do',    icon:'✅', accent:'#818cf8'},
  {key:'notes',label:'Messages', icon:'💬', accent:'#2dd4bf'},
];
const SORTS=[
  {key:'recency-desc',label:'Newest'},{key:'recency-asc',label:'Oldest'},
  {key:'alpha-asc',label:'A–Z'},{key:'alpha-desc',label:'Z–A'},
  {key:'urgency-desc',label:'Urgent↓'},{key:'urgency-asc',label:'Urgent↑'},
];
const EMOJIS=['👍','❤️','😂','😮','😢'];
const CATS=[
  {id:'produce',label:'🥦 Produce'},
  {id:'dairy',  label:'🥛 Dairy'},
  {id:'bakery', label:'🍞 Bakery'},
  {id:'meat',   label:'🥩 Meat'},
  {id:'tins',   label:'🥫 Tins'},
  {id:'drinks', label:'🧃 Drinks'},
  {id:'house',  label:'🧹 Household'},
  {id:'other',  label:'📦 Other'},
];
const CAT_HINTS={
  produce:['apple','banana','orange','carrot','tomato','lettuce','spinach','potato','onion','garlic','lemon','lime','pepper','mushroom','broccoli','cucumber','avocado','fruit','veg'],
  dairy:  ['milk','cheese','yogurt','butter','cream','egg','eggs'],
  bakery: ['bread','roll','bagel','croissant','cake','biscuit','flour','yeast'],
  meat:   ['chicken','beef','lamb','pork','fish','salmon','tuna','mince','steak','sausage'],
  drinks: ['water','juice','coke','pepsi','coffee','tea','beer','wine','drink'],
  house:  ['soap','shampoo','washing','bleach','toilet','tissue','sponge','cleaning','bin','bag'],
  tins:   ['tin','can','pasta','rice','sauce','soup','beans'],
};

// ── STATE ──
let state={shop:[],todo:[],notes:[],notices:[]};
let member=null,tabIdx=0;
let shopSort='recency-desc',todoSort='urgency-desc';
let shopFilters=new Set(['All']),todoFilters=new Set(['All']);
let shopUrg=0,todoUrg=0,shopCat='',todoCat='';
let lastTs=0,isSaving=false,pollTimer=null;
let openPicker=null,transitioning=false;
let notifDismissed=false,swReg=null,shouldFocus=false;
let showNoticeCompose=false,showPollCompose=false,pollOpts=['',''];
let undoTimer=null;
let lastReadNotes=0; // localStorage per member

// ── THEME ──
function initTheme(){
  if(localStorage.getItem('cfh-theme')==='light')document.body.classList.add('light');
  syncThemeBtn();
}
function toggleTheme(){
  document.body.classList.toggle('light');
  const l=document.body.classList.contains('light');
  localStorage.setItem('cfh-theme',l?'light':'dark');
  document.getElementById('tmeta').content=l?'#eef2ff':'#060d18';
  syncThemeBtn();
}
function syncThemeBtn(){
  const ic=document.getElementById('theme-icon');if(!ic)return;
  ic.innerHTML=document.body.classList.contains('light')
    ?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    :'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}

// ── UTILS ──
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function timeAgo(ts){
  const d=Date.now()-ts;
  if(d<60000)return'just now';
  if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';
  return Math.floor(d/86400000)+'d ago';
}
function getMem(n){return MEMBERS.find(m=>m.name===n)||MEMBERS[0]}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v)}
function sortList(arr,k){
  const a=[...arr];
  if(k==='recency-desc')return a.sort((x,y)=>y.ts-x.ts);
  if(k==='recency-asc')return a.sort((x,y)=>x.ts-y.ts);
  if(k==='alpha-asc')return a.sort((x,y)=>x.text.localeCompare(y.text));
  if(k==='alpha-desc')return a.sort((x,y)=>y.text.localeCompare(x.text));
  if(k==='urgency-desc')return a.sort((x,y)=>(y.urgency||0)-(x.urgency||0));
  if(k==='urgency-asc')return a.sort((x,y)=>(x.urgency||0)-(y.urgency||0));
  return a;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function haptic(pattern){try{navigator.vibrate(pattern||8);}catch(e){}}
function suggestCat(text){
  const t=text.toLowerCase();
  for(const [cat,words] of Object.entries(CAT_HINTS)){
    if(words.some(w=>t.includes(w)))return cat;
  }
  return '';
}

// ── OFFLINE ──
function cacheState(){
  try{localStorage.setItem('cfh-cache',JSON.stringify({state,ts:Date.now()}));}catch(e){}
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem('cfh-cache')||'null');
    if(c&&c.state)return c;
  }catch(e){}
  return null;
}
function setOffline(v){
  document.body.classList.toggle('offline',v);
}

// ── FIREBASE ──
async function fbRead(){
  const r=await fetch(FB,{signal:AbortSignal.timeout(8000)});
  if(!r.ok)throw new Error(r.status);
  const d=await r.json();
  return{shop:toArr(d&&d.shop),todo:toArr(d&&d.todo),notes:toArr(d&&d.notes),notices:toArr(d&&d.notices),updatedAt:(d&&d.updatedAt)||0};
}
async function fbWrite(data){
  const p={...data,updatedAt:Date.now()};
  const r=await fetch(FB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  if(!r.ok)throw new Error(r.status);return p.updatedAt;
}

// ── STATUS ──
function setStatus(s){
  const dot=document.getElementById('sdot'),txt=document.getElementById('stxt');
  if(!dot)return;
  const c={live:'#22c55e',saving:'#f59e0b',error:'#ef4444',offline:'#94a3b8'};
  dot.style.background=c[s]||c.live;
  txt.textContent={live:'Live',saving:'Saving',error:'Error',offline:'Offline'}[s]||'Live';
}
async function save(){
  if(isSaving)return;isSaving=true;setStatus('saving');
  cacheState();
  try{lastTs=await fbWrite(state);setStatus('live');setOffline(false);}
  catch(e){setStatus(navigator.onLine?'error':'offline');setOffline(!navigator.onLine);}
  isSaving=false;
}
function startPoll(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(isSaving)return;
    try{
      const d=await fbRead();
      if(d.updatedAt>lastTs){
        lastTs=d.updatedAt;
        state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices};
        cacheState();renderContent();renderTabs();
      }
      setOffline(false);
    }catch(e){setOffline(!navigator.onLine);}
  },5000);
}

// ── PUSH / NOTIFICATIONS ──
const VAPID_PUB='BHeqNiEDdtZG2JXW-xhJxz8ARfkIPkyfgfQjt5rjf5a4I0nQJZYRqkPGXs-MnDkT6nc3W2lPH9IFlhGMzR4OJ-0';
function b64ToU8(b64){
  const p='='.repeat((4-b64.length%4)%4);
  const r=atob((b64+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));
}
async function initSW(){
  if(!('serviceWorker' in navigator))return;
  try{swReg=await navigator.serviceWorker.register('/cheema-family-hub/sw.js',{scope:'/cheema-family-hub/'});}catch(e){console.log('SW:',e);}
}
async function subscribePush(){
  if(!swReg||!('PushManager' in window))return false;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return false;
    let sub=await swReg.pushManager.getSubscription();
    if(!sub){
        // Make sure SW is ready
        if(!swReg){
          try{swReg=await navigator.serviceWorker.register('/cheema-family-hub/sw.js',{scope:'/cheema-family-hub/'});}catch(e){}
        }
        await navigator.serviceWorker.ready;
        sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
      }
    // Simple stable key from endpoint
    const key=sub.endpoint.split('/').pop().replace(/[^a-zA-Z0-9]/g,'').slice(-20)||'sub'+Date.now();
    console.log('[CFH] Storing sub key:',key,'endpoint:',sub.endpoint.slice(0,60));
    const res=await fetch(`https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/subscriptions/${key}.json`,
      {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});
    console.log('[CFH] Sub stored, status:',res.status);
    return true;
  }catch(e){return false;}
}
async function sendPushNotif(title,body){
  if(!PUSH_RELAY)return;
  try{fetch(PUSH_RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body})});}catch(e){}
}
// Telegram batch notifs
let tgCfg=null,notifBatch=[],notifTimer2=null;
async function loadTgCfg(){
  try{const r=await fetch('https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/tg_config.json');const d=await r.json();if(d&&d.token)tgCfg=d;}catch(e){}
}
async function sendTelegram(text){
  if(!tgCfg)return;
  try{fetch(`https://api.telegram.org/bot${tgCfg.token}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:tgCfg.chatId,text,parse_mode:'HTML'})});}catch(e){}
}
function queueNotif(type,who,text){console.log("[NOTIF] queueing:",type,who,text);
  notifBatch.push({type,who,text});
  if(notifTimer2)clearTimeout(notifTimer2);
  notifTimer2=setTimeout(()=>{
    
    // 5s delay for testing, increase to 45000 for production
    const b=[...notifBatch];notifBatch=[];
    const shop=b.filter(x=>x.type==='shop'),todo=b.filter(x=>x.type==='todo'),msgs=b.filter(x=>x.type==='msg');
    const lines=[];
    if(shop.length===1)lines.push(`🛒 <b>${shop[0].who}</b> added: <i>${shop[0].text}</i>`);
    else if(shop.length>1)lines.push(`🛒 <b>${shop[0].who}</b> added ${shop.length} shopping items`);
    if(todo.length===1)lines.push(`✅ <b>${todo[0].who}</b> added: <i>${todo[0].text}</i>`);
    else if(todo.length>1)lines.push(`✅ <b>${todo[0].who}</b> added ${todo.length} tasks`);
    if(msgs.length===1)lines.push(`💬 <b>${msgs[0].who}</b>: <i>${msgs[0].text}</i>`);
    else if(msgs.length>1)lines.push(`💬 <b>${msgs[0].who}</b> sent ${msgs.length} messages`);
    if(lines.length){sendTelegram(lines.join('\n'));sendPushNotif('Cheema Family Hub',lines.map(l=>l.replace(/<[^>]+>/g,'')).join(' · '));}
  },5000);
}

// ── SCREENS ──
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function doLogout(){
  member=null;renderLogin();showScreen('login');
}

// ── LOGIN ──
function renderLogin(){
  const g=document.getElementById('mgrid');
  g.innerHTML=MEMBERS.map(m=>`
    <button class="mbtn" id="mb${m.initials}" onclick="selectMember('${esc(m.name)}')">
      <div class="av" style="width:50px;height:50px;background:${m.color}18;border:2px solid ${m.color}55;font-size:20px;color:${m.color};border-radius:28%">${m.initials}</div>
      <span class="mname" style="color:${m.color}">${esc(m.name)}</span>
    </button>`).join('');
  MEMBERS.forEach(m=>{
    const b=document.getElementById('mb'+m.initials);if(!b)return;
    const on=()=>{b.style.borderColor=m.color;b.style.background=m.color+'10';b.style.boxShadow=`0 4px 20px ${m.color}22`;b.querySelector('.av').style.transform='scale(1.1)';};
    const off=()=>{b.style.borderColor='';b.style.background='';b.style.boxShadow='';b.querySelector('.av').style.transform='';};
    b.addEventListener('mouseenter',on);b.addEventListener('mouseleave',off);
    b.addEventListener('touchstart',on,{passive:true});b.addEventListener('touchend',()=>setTimeout(off,260));
  });
}

function selectMember(name){
  member=name;localStorage.setItem('cfh_member',name);
  const m=getMem(name);
  lastReadNotes=parseInt(localStorage.getItem('cfh_read_'+name)||'0');
  const ha=document.getElementById('hav'),hn=document.getElementById('hname'),hicon=document.getElementById('hicon');
  ha.style.cssText=`width:22px;height:22px;border-radius:7px;background:${m.color}20;border:1.5px solid ${m.color}55;font-size:9px;color:${m.color};font-weight:800`;
  ha.textContent=m.initials;hn.textContent=name;
  hicon.style.background=`linear-gradient(145deg,${m.color},${m.color}88)`;
  const card=document.querySelector('.login-card');
  if(card){card.style.transition='opacity .2s ease,transform .2s ease';card.style.opacity='0';card.style.transform='scale(.95) translateY(-10px)';}
  setTimeout(()=>{
    renderTabs();renderContent();showScreen('app');
    const c=document.getElementById('content');
    c.style.transition='none';c.style.opacity='0';c.style.transform='translateY(12px)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.transition='opacity .28s ease,transform .28s ease';c.style.opacity='1';c.style.transform='none';
    }));
    if(isStandalone()&&'Notification' in window&&Notification.permission==='default')
      setTimeout(()=>subscribePush().then(ok=>ok&&renderContent()),1500);
  },200);
}

// ── TABS ──
function renderTabs(){
  const acc=TABS[tabIdx].accent;
  document.getElementById('mhdr').style.borderBottomColor=acc;
  // Unread messages indicator
  const unread=state.notes.some(n=>n.ts>lastReadNotes&&n.author!==member);
  const sc=state.shop.filter(x=>!x.done).length,tc=state.todo.filter(x=>!x.done).length;
  const sort=tabIdx===0?shopSort:todoSort;
  let html=TABS.map((t,i)=>{
    const active=tabIdx===i;
    const cnt=i===0?sc:i===1?tc:0;
    const hasUnread=i===2&&unread&&tabIdx!==2;
    return`<button class="tab-btn" onclick="setTab(${i})"
      style="color:${active?t.accent:'var(--muted)'};border-bottom-color:${active?t.accent:'transparent'};${active?`background:${t.accent}0c`:''}">
      <span class="tab-icn">${t.icon}</span>${esc(t.label)}
      ${cnt>0?`<span class="tab-cnt" style="background:${active?t.accent+'22':'var(--surf2)'};color:${active?t.accent:'var(--muted)'};border:1px solid ${active?t.accent+'44':'var(--brd)'}">${cnt}</span>`:''}

async function setTab(i){
  if(transitioning||i===tabIdx)return;
  if(typeof filterSheetOpen!=='undefined'&&filterSheetOpen)closeFilterSheet();
  transitioning=true;
  const dir=i>tabIdx?1:-1;
  const cont=document.getElementById('content');
  const W=cont.offsetWidth||window.innerWidth;
  cont.style.transition='transform .3s cubic-bezier(.4,0,.2,1)';
  cont.style.transform=`translateX(${-dir*W}px)`;
  await sleep(300);
  tabIdx=i;
  if(i===2){lastReadNotes=Date.now();localStorage.setItem('cfh_read_'+member,lastReadNotes);}
  renderTabs();renderContent();
  cont.style.transition='none';
  cont.style.transform=`translateX(${dir*W}px)`;
  cont.offsetHeight;
  cont.style.transition='transform .3s cubic-bezier(.4,0,.2,1)';
  cont.style.transform='';
  setTimeout(()=>{cont.style.transition='';transitioning=false;},320);
}

// ── SWIPE DELETE ──
function bindSwipe(outer){
  const wrap=outer.querySelector('.swipe-wrap');
  const item=outer.querySelector('.item');
  if(!wrap||!item)return;
  let sx=0,sy=0,cx=0,gone=false,dir=null; // dir: null, 'h', 'v'

  item.addEventListener('touchstart',e=>{
    if(gone)return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    cx=0; dir=null;
    item.style.transition='none';
  },{passive:true});

  item.addEventListener('touchmove',e=>{
    if(gone)return;
    const dx=e.touches[0].clientX-sx;
    const dy=e.touches[0].clientY-sy;
    if(dir===null&&(Math.abs(dx)>6||Math.abs(dy)>6)){
      // Decide on first meaningful movement
      dir=Math.abs(dx)>Math.abs(dy)*1.2?'h':'v';
    }
    if(dir!=='h')return; // vertical scroll — don't touch transform
    if(dx>4){item.style.transform='';wrap.classList.remove('swiping');return;} // right swipe ignored
    cx=Math.max(dx,-item.offsetWidth*0.85);
    item.style.transform=`translateX(${cx}px)`;
    wrap.classList.toggle('swiping',cx<-24);
  },{passive:true});

  item.addEventListener('touchend',()=>{
    if(gone)return;
    if(dir!=='h'){
      cx=0;wrap.classList.remove('swiping');dir=null;return;
    }
    dir=null;
    if(cx<-item.offsetWidth*0.38){
      // Delete
      gone=true; haptic([8,30,12]);
      wrap.classList.add('swiping');
      item.style.transition='transform .22s ease, opacity .16s ease';
      item.style.transform=`translateX(-${item.offsetWidth+20}px)`;
      item.style.opacity='0';
      setTimeout(()=>{
        outer.style.transition='max-height .3s ease, margin-bottom .3s ease, opacity .24s ease';
        outer.style.overflow='hidden';
        outer.style.maxHeight=outer.offsetHeight+'px';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          outer.style.maxHeight='0';
          outer.style.opacity='0';
          outer.style.marginBottom='0';
        }));
        setTimeout(()=>delItem(wrap.dataset.id),320);
      },200);
    }else{
      // Snap back with spring
      item.style.transition='transform .28s cubic-bezier(.34,1.4,.64,1)';
      item.style.transform='';
      wrap.classList.remove('swiping');
      cx=0;
    }
  });
}


// ── PULL TO REFRESH ──
function initPullRefresh(){
  const cont=document.getElementById('content'),ptr=document.getElementById('ptr');
  if(!cont||!ptr||cont._ptr)return;
  cont._ptr=true;
  let sy=0,pulling=false,triggered=false,refreshing=false;

  cont.addEventListener('touchstart',e=>{
    if(cont.scrollTop!==0||refreshing)return;
    sy=e.touches[0].clientY;pulling=true;triggered=false;
  },{passive:true});

  cont.addEventListener('touchmove',e=>{
    if(!pulling)return;
    const dy=e.touches[0].clientY-sy;
    if(dy<=0||cont.scrollTop>0){ptr.classList.remove('show');triggered=false;return;}
    const pull=Math.min(dy*0.45,80);
    cont.style.transition='none';
    cont.style.transform=`translate3d(0,${pull}px,0)`;
    if(pull>=40){
      ptr.classList.add('show');
      if(pull>=58&&!triggered){triggered=true;haptic(14);}
    }else{
      ptr.classList.remove('show');triggered=false;
    }
  },{passive:true});

  cont.addEventListener('touchend',async()=>{
    if(!pulling)return;pulling=false;
    cont.style.transition='transform .32s cubic-bezier(.4,0,.2,1)';
    cont.style.transform='translate3d(0,0,0)';
    if(!triggered){
      setTimeout(()=>{cont.style.transition='';cont.style.transform='';},340);
      ptr.classList.remove('show');
      return;
    }
    refreshing=true;
    ptr.classList.add('show');
    const t0=Date.now();
    try{
      const d=await fbRead();
      state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices};
      lastTs=d.updatedAt;cacheState();setOffline(false);
    }catch(e2){}
    const elapsed=Date.now()-t0;
    if(elapsed<900)await sleep(900-elapsed);
    ptr.classList.remove('show');
    setTimeout(()=>{cont.style.transition='';cont.style.transform='';},340);
    refreshing=false;
    renderContent();renderTabs();
  },{passive:true});
}

  const poll={id:genId(),q,opts:opts.map(o=>({text:o,votes:{}})),author:member,ts:Date.now(),type:'poll'};
  state.notes=[poll,...state.notes];showPollCompose=false;pollOpts=['',''];renderContent();save();

function votePoll(nid,oi){
  state.notes=state.notes.map(n=>{
    if(n.id!==nid||n.type!=='poll')return n;
    const opts=n.opts.map(o=>{const v={...(o.votes||{})};delete v[member];return{...o,votes:v};})
      .map((o,i)=>i===oi?{...o,votes:{...(o.votes||{}),[member]:true}}:o);
    return{...n,opts};
  });
  haptic(10);renderContent();save();

    return`<div class="poll-option${voted?' voted':''}" style="color:${voted?auth.color:'var(--sub)'}" onclick="votePoll('${n.id}',${i})">
      <div class="poll-bar" style="width:${pct}%;background:${auth.color}"></div>
      <div class="poll-inner"><span>${esc(o.text)}${voted?' ✓':''}</span><span class="poll-pct">${total?pct+'%':''}</span></div>
    </div>`;
  }).join('');
  return`<div class="nwrap ${isMe?'mine':'theirs'}">
    <div class="nhdr" style="flex-direction:${isMe?'row-reverse':'row'}">
      <div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div>
      <span class="nauthor" style="color:${auth.color}">${esc(n.author)}</span>
      <span class="ntime">${timeAgo(n.ts)}</span>
    </div>
    <div class="nbubble ${isMe?'mine':'theirs'}" style="min-width:200px;background:${isMe?auth.color+'18':'var(--surf2)'};border-color:${isMe?auth.color+'44':'var(--brd)'}${!isMe?`;border-left-color:${auth.color}88`:''}">
      <div class="poll-question">${esc(n.q)}</div>${opts}<div class="poll-voters">${total} vote${total!==1?'s':''}</div>
    </div>
    ${isMe?`<button class="ndel" onclick="delNote('${n.id}')">Delete poll</button>`:''}
  </div>`;
}

// ── EMOJI PICKER ──
function showPicker(e,nid){
  e.stopPropagation();
  document.querySelectorAll('.epicker').forEach(p=>p.remove());
  if(openPicker===nid){openPicker=null;return;}
  openPicker=nid;
  const p=document.createElement('div');p.className='epicker';
  p.innerHTML=EMOJIS.map(em=>`<button class="eopt" onclick="toggleRx('${nid}','${em}');closePicker()">${em}</button>`).join('');
  document.getElementById('rb'+nid)?.appendChild(p);
  setTimeout(()=>document.addEventListener('click',closePicker,{once:true}),10);
}
function closePicker(){document.querySelectorAll('.epicker').forEach(p=>p.remove());openPicker=null;}

// ── REACTIONS ──
function toggleRx(nid,emoji){
  closePicker();haptic(8);
  state.notes=state.notes.map(n=>{
    if(n.id!==nid)return n;
    const rx={...(n.reactions||{})},who=[...(rx[emoji]||[])];
    const idx=who.indexOf(member);if(idx>=0)who.splice(idx,1);else who.push(member);
    if(!who.length)delete rx[emoji];else rx[emoji]=who;
    return{...n,reactions:rx};
  });
  renderContent();save();
}

// ── UNDO TOAST ──
function showUndoToast(msg,onUndo){
  document.querySelector('.undo-toast')?.remove();
  const t=document.createElement('div');t.className='undo-toast';
  t.innerHTML=`<span class="undo-txt">${msg}</span><button class="undo-btn" onclick="this.closest('.undo-toast')._undo()">Undo</button>`;
  t._undo=()=>{clearTimeout(undoTimer);t.remove();onUndo();};
  document.body.appendChild(t);
  undoTimer=setTimeout(()=>t.remove(),4500);
}

// ── ITEM PHOTOS ──
function addPhoto(itemId){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const canvas=document.createElement('canvas'),img=new Image();
    img.onload=()=>{
      const MAX=320,ratio=Math.min(MAX/img.width,MAX/img.height,1);
      canvas.width=img.width*ratio;canvas.height=img.height*ratio;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const b64=canvas.toDataURL('image/jpeg',0.75);
      const k=tabIdx===0?'shop':'todo';
      state[k]=state[k].map(i=>i.id===itemId?{...i,photo:b64}:i);
      renderContent();save();
    };
    img.src=URL.createObjectURL(file);
  };
  inp.click();
}
function viewPhoto(b64){
  const m=document.createElement('div');m.className='photo-modal';
  m.innerHTML=`<img src="${b64}"><button class="photo-modal-close" onclick="this.parentElement.remove()">✕</button>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

// ── ACTIONS ──
function addItem(){
  const inp=document.getElementById('mi'),text=inp?.value.trim();if(!text)return;
  const isS=tabIdx===0,urg=isS?shopUrg:todoUrg;
  const cat=isS?shopCat:todoCat;
  const autoCat=cat||(isS?suggestCat(text):'');
  const it={id:genId(),text,urgency:urg,cat:autoCat,addedBy:member,done:false,ts:Date.now()};
  if(isS)state.shop=[it,...state.shop];else state.todo=[it,...state.todo];
  if(isS){shopUrg=0;shopCat='';}else{todoUrg=0;todoCat='';}
  inp.value='';shouldFocus=true;haptic(8);renderTabs();renderContent();save();
  queueNotif(isS?'shop':'todo',member,text);
  // Also send immediately so we don't have to wait
  sendPushNotif(`${member} added to ${isS?'Shopping':'To-Do'}`,text);
}
function setUrg(i){
  const inp=document.getElementById('mi'),saved=inp?inp.value:'';
  if(tabIdx===0)shopUrg=i;else todoUrg=i;
  renderContent();
  const mi=document.getElementById('mi');if(mi&&saved){mi.value=saved;mi.focus();}
}
function cycleUrg(e,id){
  e.stopPropagation();haptic(8);
  const k=tabIdx===0?'shop':'todo';
  state[k]=state[k].map(i=>i.id!==id?i:{...i,urgency:((i.urgency??0)+1)%3});
  renderContent();save();
}
function toggleItem(id){
  haptic([8,20,8]);
  const k=tabIdx===0?'shop':'todo';
  const it=state[k].find(i=>i.id===id);if(!it)return;
  const nowDone=!it.done;
  state[k]=state[k].map(i=>i.id===id?{...i,done:nowDone,doneBy:nowDone?member:undefined}:i);
  if(nowDone){
    showUndoToast(`Ticked off "${it.text.slice(0,28)}"`,()=>{
      state[k]=state[k].map(i=>i.id===id?{...i,done:false,doneBy:undefined}:i);
      renderTabs();renderContent();save();
    });
  }
  renderTabs();renderContent();save();
}
function delItem(id){
  const k=tabIdx===0?'shop':'todo';
  state[k]=state[k].filter(i=>i.id!==id);renderTabs();renderContent();save();
}
function clearDone(){
  const k=tabIdx===0?'shop':'todo';
  state[k]=state[k].filter(i=>!i.done);renderTabs();renderContent();save();
}
function postNote(){
  const inp=document.getElementById('ni'),text=inp?.value.trim();if(!text)return;
  const note={id:genId(),text,author:member,ts:Date.now(),reactions:{}};
  state.notes=[note,...state.notes];
  inp.value='';haptic(8);
  // Don't call renderContent() — that dismisses keyboard
  // Instead inject new message into DOM directly
  const feed=document.querySelector('.msg-feed');
  if(feed){
    const auth=getMem(member);
    const div=document.createElement('div');
    div.className='nwrap mine';
    div.style.cssText='animation:itemIn .2s var(--ease) both';
    div.innerHTML=`
      <div class="nhdr" style="flex-direction:row-reverse">
        <div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div>
        <span class="nauthor" style="color:${auth.color}">${esc(member)}</span>
        <span class="ntime">just now</span>
      </div>
      <div class="nbubble mine" style="background:${auth.color}18;border-color:${auth.color}44">
        <div class="ntext">${esc(text)}</div>
      </div>
      <div class="rbar" id="rb${note.id}"><button class="radd" onclick="showPicker(event,'${note.id}')">+</button></div>
      <button class="ndel" onclick="delNote('${note.id}')">Delete</button>`;
    feed.insertBefore(div,feed.firstChild);
    // Remove empty state if present
    feed.querySelector('.empty')?.remove();
  }
  // Keep textarea focused
  inp.focus();
  save();
  queueNotif('msg',member,text);
  // Update unread badge in background
  renderTabs();
}
function delNote(id){state.notes=state.notes.filter(n=>n.id!==id);renderContent();save();}
function setFilter(n){if(tabIdx===0)shopFilter=n;else todoFilter=n;renderContent();}

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent);}
function renderInstallBanner(){}
async function initPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try{
    if(!swReg)swReg=await navigator.serviceWorker.register('/cheema-family-hub/sw.js',{scope:'/cheema-family-hub/'});
    await navigator.serviceWorker.ready;
    const existing=await swReg.pushManager.getSubscription();
    if(existing&&Notification.permission==='granted'){
      const key=btoa(existing.endpoint).slice(-22).replace(/[^a-zA-Z0-9]/g,'');
      await fetch(`https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/subscriptions/${key}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(existing.toJSON())});
    }
  }catch(e){}
}

// ── TAB SWIPE ──
function initTabSwipe(){
  const content=document.getElementById('content');
  if(!content||content._tsb)return;
  content._tsb=true;

  let sx=0,sy=0,mode=null; // mode: null=undecided, 'tab'=tab-switch, 'other'=let browser handle

  function onTouchStart(e){
    mode=null;
    sx=e.touches[0].clientX;
    sy=e.touches[0].clientY;
    // Always listen — we'll decide what to do on move
  }

  function onTouchMove(e){
    if(mode==='other')return;
    const dx=e.touches[0].clientX-sx;
    const dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    if(mode===null){
      const isEdge=sx<window.innerWidth*0.2||sx>window.innerWidth*0.8;
      const isHoriz=Math.abs(dx)>Math.abs(dy)*0.9;
      const onItem=e.target.closest('.item,.swipe-wrap,.swipe-outer');
      if(isHoriz&&!onItem){
        // Edge swipe always starts tab switch
        // Interior swipe also starts tab switch IF not on an item
        mode='tab';
      }else if(isEdge&&isHoriz){
        mode='tab'; // edge overrides items too
      }else{
        mode='other';
      }
    }
  }

  function onTouchEnd(e){
    if(mode!=='tab'){mode=null;return;}
    mode=null;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*0.7||transitioning)return;
    if(dx<0&&tabIdx<TABS.length-1)setTab(tabIdx+1);
    else if(dx>0&&tabIdx>0)setTab(tabIdx-1);
  }

  content.addEventListener('touchstart',onTouchStart,{passive:true});
  content.addEventListener('touchmove',onTouchMove,{passive:true});
  content.addEventListener('touchend',onTouchEnd,{passive:true});

  // Also listen on the whole page for edge swipes (catches header/empty areas)
  if(!document._edgeSwipe){
    document._edgeSwipe=true;
    let esx=0,esy=0,eMode=null;
    document.addEventListener('touchstart',e=>{
      esx=e.touches[0].clientX;esy=e.touches[0].clientY;eMode=null;
    },{passive:true});
    document.addEventListener('touchmove',e=>{
      if(eMode==='done')return;
      const dx=e.touches[0].clientX-esx,dy=e.touches[0].clientY-esy;
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      const isEdge=esx<window.innerWidth*0.18||esx>window.innerWidth*0.82;
      if(isEdge&&Math.abs(dx)>Math.abs(dy)){eMode='edge';}else{eMode='done';}
    },{passive:true});
    document.addEventListener('touchend',e=>{
      if(eMode!=='edge'){eMode=null;return;}
      eMode='done';
      const dx=e.changedTouches[0].clientX-esx,dy=e.changedTouches[0].clientY-esy;
      if(Math.abs(dx)<55||Math.abs(dy)>Math.abs(dx)*0.8||transitioning)return;
      if(dx<0&&tabIdx<TABS.length-1)setTab(tabIdx+1);
      else if(dx>0&&tabIdx>0)setTab(tabIdx-1);
    },{passive:true});
  }
}

// ── INIT ──
async function init(){
  try{initTheme();}catch(e){}
  showScreen('loading');
  // Show cached data immediately
  const cache=loadCache();
  if(cache){state=cache.state;}
  try{await initSW();}catch(e){}
  // Fetch fresh data
  try{
    const d=await fbRead();
    state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices};
    lastTs=d.updatedAt;cacheState();setStatus('live');setOffline(false);
  }catch(e){
    if(!cache){setStatus('error');renderLogin();showScreen('login');return;}
    setStatus('offline');setOffline(true);
  }
  try{
    renderLogin();
    const saved=localStorage.getItem('cfh_member');
    const ok=saved&&MEMBERS.find(m=>m.name===saved);
    if(ok){selectMember(saved);}else{showScreen('login');}
    startPoll();
  }catch(e){showScreen('login');}
  try{loadTgCfg();}catch(e){}
  try{initPush();}catch(e){}
  window.addEventListener('online', ()=>{setOffline(false);setStatus('live');save();});
  window.addEventListener('offline',()=>{setOffline(true);setStatus('offline');});
}
init();
