================================================================

  APP OVERVIEW:
  - Single-file PWA (index.html) served via GitHub Pages

  - Push notifications via Cloudflare Worker: https://cfh-push.jivancheemalfc.workers.dev

  - Live URL: https://j-c-81.github.io/cheema-family-hub

  MEMBERS: Mum, Dad, Jiv, Rajan(Midget)
  TABS: Shopping, To-Do, Messages
  
  KEY FUNCTIONS:
  - renderContent()     — re-renders current tab
  - renderTabs()        — re-renders tab bar
  - setTab(i)           — switches to tab i with real slide animation
  - fbRead()            — reads all data from Firebase
  - fbWrite(path, data) — writes to Firebase
  - postNote()          — sends a message (keyboard stays up)
  - bindSwipe(outer)    — attaches swipe-to-delete (axis-locked)
  - initTabSwipe()      — edge-aware tab swipe gestures
  - initPullRefresh()   — sets up pull-to-refresh (1400ms min)
  - openFilterSheet()   — opens filter/sort bottom sheet
  - selectMember(name)  — logs in as a family member
  - haptic(pattern)     — triggers haptic feedback
  - delItem(id)         — deletes item from current tab
  - checkVersionUpdate()— shows update popup if version changed
  - showInstallPopup()  — first-open install-to-home-screen guide
  - sendPushNotif(t,b,addedBy) — sends push, excludes sender's devices

  DARK MODE: :root.dark class on documentElement (NOT body)
  THEME INIT: script in <head> before paint to avoid flash
  SW PATH: /cheema-family-hub/sw.js

  VERSION FORMAT — STRICTLY FOLLOW THIS:
  vMAJOR.MEDIUM.SMALL
  - MAJOR (1st number): huge app-changing redesign or structural overhaul
  - MEDIUM (2nd number): new features or significant behaviour changes
  - SMALL (3rd number): bug fixes, cosmetic tweaks, minor improvements
  
  EXAMPLES:
  - v4.2.1 → v5.0.0  (complete redesign)
  - v4.2.1 → v4.3.0  (added a new feature)
  - v4.2.1 → v4.2.2  (fixed a bug or small visual tweak)
  
  ALWAYS bump the version on every single push, no exceptions.

  RULES FOR EVERY UPDATE:
  1. Bump the version number in: const VER='vX.X.X';
  2. Add an entry to the CHANGELOG below (newest at top)
  3. Make surgical edits — do NOT rewrite the whole file
  4. Tag every git push with the version: git tag vX.X.X
  5. Commit message format: "vX.X.X: short description"
  6. Never remove or rename key functions without updating
     this comment block

  CHANGELOG:
  v4.3.0 - Real slide transition between tabs (cloned ghost pane),
            longer pull-to-refresh (1400ms min) with smoother spring,
            reworked swipe-to-delete: axis-lock so it no longer fights
            vertical scroll, 35%-width threshold, rubber-band release,
            edge-anchored tab swipes that reach the very screen edges,
            multi-select filters (any combo of members + categories),
            fixed "Reset to defaults" actually resets sort too,
            update-detected popup on first open after version change,
            install-to-home-screen popup for new visitors (iOS/Android
            auto-detected), push notifications now exclude sender's own
            registered devices via addedBy field (worker already
            supported this; client was not sending it), batch-add
            notification debounce extended to 8s so rapid adds group
            into a single push, keyboard focus hardened in Messages.
  v4.3.1 - Fixed swipe-to-delete (no longer conflicts with scrolling),
            new pull-to-refresh: arc spinner with pull/release/done states
  v4.2.1 - Restored Claude Code version: filter sheet, SVG icons,
            light theme default, correct dark mode (:root.dark),
            pull-to-refresh (900ms min), undo tick (4.5s toast),

            emoji reactions, offline mode, PWA manifest, sw.js,

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" id="tmeta" content="#eef2ff">

<title>Cheema Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ff;--surf:#fff;--surf2:#e4ecfa;--surf3:#d6e4f5;
  --brd:#c0d0ea;--brd2:#a8bedc;
  --text:#060d18;--sub:#4a6280;--muted:#90aac8;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 4px 16px rgba(6,13,24,.08);--shadow-lg:0 12px 40px rgba(6,13,24,.12);
  --r:14px;--r-lg:20px;--r-xl:24px;
}
:root.dark{
  --bg:#09090c;--surf:#15151a;--surf2:#20202a;--surf3:#2c2c38;
  --brd:#272730;--brd2:#3a3a45;
  --text:#ededf2;--sub:#9999aa;--muted:#52525e;
  --shadow:0 4px 24px rgba(0,0,0,.5);--shadow-lg:0 12px 48px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none;transition:background .3s var(--ease),color .3s var(--ease)}
button,input,textarea,select{font-family:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted)}
::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100dvh}
.screen.active{display:flex;flex-direction:column}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}60%{box-shadow:0 0 0 6px transparent}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes loadfill{from{width:0}to{width:75%}}
@keyframes ptr-bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-7px);opacity:1}}
#loading{align-items:center;justify-content:center;flex-direction:column;gap:18px}
.load-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#60a5fa,#818cf8);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(96,165,250,.3);animation:scaleIn .4s var(--spring) both}
.load-label{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.3px}
.load-bar{width:140px;height:3px;background:var(--brd);border-radius:99px;overflow:hidden;margin-top:4px}
.load-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#818cf8);border-radius:99px;animation:loadfill 1.2s ease both}
#login{align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden}
.glow-a,.glow-b{position:fixed;pointer-events:none;border-radius:50%}
.glow-a{top:-20%;left:-15%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(96,165,250,.07) 0%,transparent 70%)}
.glow-b{bottom:-15%;right:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(129,140,248,.07) 0%,transparent 70%)}
.login-card{position:relative;z-index:1;background:var(--surf);border-radius:var(--r-xl);border:1px solid var(--brd);box-shadow:var(--shadow-lg);padding:28px 20px;width:100%;max-width:310px;animation:scaleIn .4s var(--spring) both}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#60a5fa,#818cf8);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(96,165,250,.28)}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.5px}
.brand-sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.divider{height:1px;background:var(--brd);margin:0 0 18px}
.who-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:11px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--r-lg);padding:16px 8px 13px;cursor:pointer;transition:border-color .18s,background .18s,transform .12s var(--ease),box-shadow .2s}
.mbtn:active{transform:scale(.93)}
.mname{font-size:12px;font-weight:600}
.av{border-radius:28%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;user-select:none;transition:transform .2s var(--spring)}
.offline-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#f59e0b;color:white;font-size:12px;font-weight:700;text-align:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;letter-spacing:.2px}
body.offline .offline-banner{display:block}
body.offline header{top:calc(36px + env(safe-area-inset-top));padding-top:11px}
header{border-bottom:1.5px solid var(--brd);padding:calc(11px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:100;background:rgba(238,242,255,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:border-color .3s,top .2s,background .3s}
:root.dark header{background:rgba(9,9,12,.9)}
.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.h-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.h-icon{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s}
.h-meta{min-width:0}
.h-lbl{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;line-height:1}
.h-title{font-size:14px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.h-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.hbtn{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:1px solid var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform .15s var(--spring),background .3s;flex-shrink:0;color:var(--sub)}
.hbtn:active{transform:scale(.82)}
.status-pill{display:flex;align-items:center;gap:3px;padding:3px 7px;background:var(--surf2);border-radius:20px;border:1px solid var(--brd)}
.sdot{width:5px;height:5px;border-radius:50%;transition:background .4s;animation:blink 4s infinite}
.stxt{font-size:9px;font-weight:600;color:var(--sub)}
.m-chip{display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--brd);border-radius:20px;padding:3px 9px 3px 4px;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.m-chip:active{opacity:.7}
.chip-name{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.tabs-row{display:flex;align-items:flex-end}
.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 2px 10px;border:none;background:transparent;font-size:11.5px;font-weight:700;cursor:pointer;letter-spacing:-.1px;transition:color .2s var(--ease),background .2s;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;min-width:0}
.tab-icn{display:inline-flex;align-items:center;line-height:1}
.tab-cnt{font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px;transition:all .2s;flex-shrink:0;min-width:16px;text-align:center}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;will-change:transform}
.content-stage{position:relative;flex:1;overflow:hidden}
.tab-ghost{position:absolute;inset:0;overflow:hidden;pointer-events:none;will-change:transform;background:var(--bg);z-index:5}
.accent-strip{height:2px;transition:background .3s}
/* ptr handled dynamically via ptr-bar */
.input-card{margin:12px 12px 0;background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);box-shadow:var(--shadow);transition:background .3s,border-color .3s;animation:fadeUp .25s var(--ease) both}
.input-row{display:flex;align-items:center;border-bottom:1px solid var(--brd)}
.main-input{flex:1;min-width:0;padding:13px 13px;border:none;background:transparent;font-size:15px;font-weight:500;outline:none;color:var(--text)}
.add-btn{margin:5px;padding:8px 15px;border-radius:10px;border:none;font-weight:700;font-size:13px;color:white;transition:transform .12s var(--ease),opacity .12s,background .25s;white-space:nowrap;flex-shrink:0;cursor:pointer}
.add-btn:active{transform:scale(.88);opacity:.85}
.urg-row{display:flex;align-items:center;gap:4px;padding:7px 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.urg-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;flex-shrink:0;margin-right:2px}
.urg-btn{display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-weight:600;font-size:11px;flex-shrink:0;transition:all .15s var(--ease);cursor:pointer;border-width:1.5px;border-style:solid;white-space:nowrap}
.urg-btn:active{transform:scale(.88)}
.udot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.filter-trigger{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:var(--surf2);border:1px solid var(--brd);border-radius:8px;font-size:10.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:background .15s;position:relative}
.filter-trigger:active{opacity:.7}
.filter-trigger .filter-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;position:absolute;top:-3px;right:-3px;border:2px solid var(--bg)}
.fsheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.fsheet-back.open{opacity:1;pointer-events:auto}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--surf);border-top-left-radius:20px;border-top-right-radius:20px;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s var(--ease);max-height:85vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.fsheet.open{transform:translateY(0)}
.fsheet-grip{width:38px;height:4px;background:var(--brd2);border-radius:2px;margin:4px auto 14px}
.fsheet-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.fsheet-title{font-size:16px;font-weight:800;letter-spacing:-.2px}
.fsheet-done{background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;padding:4px 2px}
.fsheet-sec{margin-bottom:18px}
.fsheet-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.fsheet-pills{display:flex;flex-wrap:wrap;gap:6px}
.fsheet-clear{width:100%;padding:11px;background:transparent;border:1px solid var(--brd);border-radius:10px;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
.fsheet-clear:active{background:var(--surf2)}
.fsheet .sort-sel{width:100%;padding:10px 12px;font-size:13px;font-weight:600}
.sort-sel{padding:4px 8px;border-radius:8px;background:var(--surf2);font-size:10px;font-weight:700;outline:none;cursor:pointer;border-width:1.5px;border-style:solid;appearance:none;-webkit-appearance:none;transition:background .3s}
.f-btn{display:flex;align-items:center;gap:3px;padding:4px 10px;border-radius:20px;flex-shrink:0;font-weight:600;font-size:11px;cursor:pointer;transition:all .15s var(--ease);white-space:nowrap;border-width:1.5px;border-style:solid}
.f-btn:active{transform:scale(.91)}
.list-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
.list-hdr-txt{font-size:11px;color:var(--muted);font-weight:600}
.list-wrap{padding:2px 12px 0}
.swipe-outer{position:relative;margin-bottom:6px;border-radius:var(--r);overflow:hidden;animation:itemIn .2s var(--ease) both}
.swipe-outer:nth-child(2){animation-delay:.04s}
.swipe-outer:nth-child(3){animation-delay:.07s}
.swipe-outer:nth-child(4){animation-delay:.10s}
.swipe-outer:nth-child(n+5){animation-delay:.13s}
.swipe-wrap{position:relative;background:var(--surf);border-radius:var(--r);overflow:hidden}
.swipe-delete-bg{position:absolute;right:0;top:0;bottom:0;width:80px;background:#ef4444;display:flex;align-items:center;justify-content:center;border-radius:0 var(--r) var(--r) 0;transition:width .2s ease}
.swipe-handle{position:absolute;right:0;top:0;bottom:0;width:40px;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:3}
.swipe-handle::after{content:'';display:block;width:3px;height:20px;border-radius:2px;background:var(--brd2);box-shadow:-6px 0 0 var(--brd2)}
.swipe-delete-bg{position:absolute;right:0;top:0;bottom:0;width:80px;background:#ef4444;display:flex;align-items:center;justify-content:center;border-radius:var(--r);opacity:0;transition:opacity .15s}
.swipe-delete-bg svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
.swipe-handle{position:absolute;right:0;top:0;bottom:0;width:36px;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;opacity:.25;z-index:2}
.swipe-handle::after{content:'';display:block;width:3px;height:22px;border-radius:2px;background:var(--sub);box-shadow:-5px 0 0 var(--sub)}
.item{position:relative;z-index:1}
.item{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:var(--r);padding:11px 12px;border:1px solid var(--brd);border-left-width:3px;position:relative;z-index:1;will-change:transform;touch-action:pan-y;transition:background .3s,border-color .3s}
.item.done{opacity:.28}
.ichk{width:22px;height:22px;border-radius:7px;border:1.5px solid;background:transparent;cursor:pointer;flex-shrink:0;padding:0;transition:all .18s var(--spring);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.ichk:active{transform:scale(.78)}
.ibody{flex:1;min-width:0}
.itext{font-size:14px;font-weight:500;color:var(--text);word-break:break-word;overflow-wrap:anywhere;line-height:1.4}
.itext.struck{text-decoration:line-through;color:var(--sub)}
.imeta{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.icat{font-size:10px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:3px;flex-shrink:0;margin-left:auto;opacity:.75}
.iname{font-size:10px;font-weight:700;flex-shrink:0}
.iurg{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0;transition:opacity .14s}
.iurg:active{opacity:.6}
.itime{font-size:10px;color:var(--muted);font-weight:500}
.del-btn{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:3px;line-height:1;transition:color .14s,transform .14s;flex-shrink:0;opacity:.4}
.del-btn:active{color:#ef4444;opacity:1;transform:scale(1.2)}
.done-sec{padding:0 12px}
.done-sep{height:1px;background:var(--brd);margin:8px 0 0}
.done-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 0 7px}
.done-ttl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.clear-btn{font-size:11px;font-weight:600;color:var(--sub);background:var(--surf2);border:1px solid var(--brd);cursor:pointer;padding:3px 8px;border-radius:7px;transition:opacity .14s}
.clear-btn:active{opacity:.7}
.empty{text-align:center;padding:52px 24px 32px;animation:fadeUp .3s var(--ease) both}
.empty-icon{width:52px;height:52px;border-radius:16px;background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
.empty-title{font-size:15px;font-weight:700;color:var(--sub)}
.empty-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.undo-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surf3);border:1px solid var(--brd2);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);z-index:400;animation:slideUp .22s var(--spring) both;white-space:nowrap}
.undo-txt{font-size:13px;font-weight:600;color:var(--text)}
.undo-btn{font-size:12px;font-weight:700;color:#60a5fa;background:none;border:none;cursor:pointer;padding:2px 0}
.notice-wrap{margin:11px 12px 0;animation:fadeUp .2s var(--ease) both}

async function setTab(i){

  ghost.innerHTML=c.innerHTML;
  // Match current scroll position so the ghost doesn't jump
  ghost.scrollTop=c.scrollTop;
  c.parentNode.insertBefore(ghost,c.nextSibling);

  void c.offsetHeight;

  ghost.style.transition=`transform .34s ${SLIDE_EASE}`;

  ghost.style.transform=`translate3d(${-dir*100}%,0,0)`;

    c.style.transform='';

function initPullRefresh(){

ackground:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div><span class="nauthor" style="color:${auth.color}">${esc(n.author)}</span><span class="ntime">${timeAgo(n.ts)}</span></div><div class="nbubble ${isMe?'mine':'theirs'}" style="background:${isMe?auth.color+'18':'var(--surf2)'};border-color:${isMe?auth.color+'44':'var(--brd)'}${!isMe?`;border-left-color:${auth.color}88`:''}"><div class="ntext">${esc(n.text)}</div></div><div class="rbar" id="rb${n.id}">${rxH}<button class="radd" onclick="showPicker(event,'${n.id}')">+</button></div>${isMe?`<button class="ndel" onclick="delNote('${n.id}')">Delete</button>`:''}</div>`;}).join('');const composeSection=showNoticeCompose&&!notices.length?'':`<div class="msg-compose" style="border-top-color:${acc}"><textarea class="msg-ta" id="ni" placeholder="Message the family…" style="caret-color:${acc}"></textarea><div class="msg-ft"><div class="msg-as"><div class="av" style="width:20px;height:20px;font-size:8px;color:${me.color};background:${me.color}18;border:1.5px solid ${me.color}44;border-radius:28%;flex-shrink:0">${me.initials}</div><span>as</span><b style="color:${me.color};margin-left:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(member)}</b></div><div class="msg-actions"><button class="msg-tool-btn" onclick="showPollCompose=!showPollCompose;renderContent()" title="Create poll">${iconSvg('poll',14)}</button><button class="post-btn" id="pb" style="background:${acc}">Send</button></div></div></div>${showPollCompose?buildPollCompose():''}`;return`${notifBar()}${noticeBlock}${composeSection}<div class="msg-feed">${feed}</div><div class="footer"><div class="fdot"></div><span class="ftxt">Family Hub</span><span class="fver">${VER}</span></div>`;}
function bindMsgEv(){const b=document.getElementById('pb'),i=document.getElementById('ni');if(b)b.onclick=postNote;if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postNote();}});initTabSwipe();initPullRefresh();}
function noticeCompose(){return`<div class="notice-compose"><textarea id="notice-ta" placeholder="Write a notice…" rows="2" style="caret-color:#f59e0b"></textarea><div class="notice-compose-ft"><button onclick="showNoticeCompose=false;renderContent()" style="background:var(--surf2);border:1px solid var(--brd);color:var(--sub)">Cancel</button><button onclick="postNotice()" style="background:#f59e0b;color:white;border:none">${iconSvg('pin',12)} Pin it</button></div></div>`;}
function postNotice(){const text=document.getElementById('notice-ta')?.value.trim();if(!text)return;state.notices=[{id:genId(),text,author:member,ts:Date.now()},...(state.notices||[])];showNoticeCompose=false;renderContent();save();}
function unpinNotice(id){state.notices=(state.notices||[]).filter(n=>n.id!==id);renderContent();save();}
function buildPollCompose(){const opts=pollOpts.map((o,i)=>`<div class="poll-opt-row"><input class="poll-opt-input" placeholder="Option ${i+1}" value="${esc(o)}" oninput="pollOpts[${i}]=this.value">${pollOpts.length>2?`<button class="poll-opt-rm" onclick="pollOpts.splice(${i},1);renderContent()">×</button>`:''}</div>`).join('');return`<div class="poll-compose" style="margin:8px 12px 0"><input class="poll-q-input" id="poll-q" placeholder="Ask the family something…" value="${esc(pollQ)}" oninput="pollQ=this.value">${opts}<div class="poll-actions">${pollOpts.length<4?`<button class="poll-add-opt" onclick="pollOpts.push('');renderContent()">+ Option</button>`:''}<button class="poll-submit" style="background:${TABS[2].accent}" onclick="postPoll()">Post Poll</button><button class="poll-cancel" onclick="showPollCompose=false;pollOpts=['',''];pollQ='';renderContent()">Cancel</button></div></div>`;}
function postPoll(){const q=(pollQ||'').trim(),opts=pollOpts.filter(o=>o.trim());if(!q||opts.length<2)return;const poll={id:genId(),q,opts:opts.map(o=>({text:o,votes:{}})),author:member,ts:Date.now(),type:'poll'};state.notes=[poll,...state.notes];showPollCompose=false;pollOpts=['',''];pollQ='';renderContent();save();queueNotif('msg',member,q);}
function votePoll(nid,oi){state.notes=state.notes.map(n=>{if(n.id!==nid||n.type!=='poll')return n;const opts=n.opts.map(o=>{const v={...(o.votes||{})};delete v[member];return{...o,votes:v};}).map((o,i)=>i===oi?{...o,votes:{...(o.votes||{}),[member]:true}}:o);return{...n,opts};});haptic(10);renderContent();save();}
function renderPollBubble(n,auth,isMe){const total=n.opts.reduce((s,o)=>s+Object.keys(o.votes||{}).length,0);const myV=n.opts.findIndex(o=>(o.votes||{})[member]);const opts=n.opts.map((o,i)=>{const cnt=Object.keys(o.votes||{}).length,pct=total?Math.round(cnt/total*100):0,voted=myV===i;return`<div class="poll-option${voted?' voted':''}" style="color:${voted?auth.color:'var(--sub)'}" onclick="votePoll('${n.id}',${i})"><div class="poll-bar" style="width:${pct}%;background:${auth.color}"></div><div class="poll-inner"><span>${esc(o.text)}${voted?' ✓':''}</span><span class="poll-pct">${total?pct+'%':''}</span></div></div>`;}).join('');return`<div class="nwrap ${isMe?'mine':'theirs'}"><div class="nhdr" style="flex-direction:${isMe?'row-reverse':'row'}"><div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div><span class="nauthor" style="color:${auth.color}">${esc(n.author)}</span><span class="ntime">${timeAgo(n.ts)}</span></div><div class="nbubble ${isMe?'mine':'theirs'}" style="min-width:200px;background:${isMe?auth.color+'18':'var(--surf2)'};border-color:${isMe?auth.color+'44':'var(--brd)'}${!isMe?`;border-left-color:${auth.color}88`:''}"><div class="poll-question">${n.pinned?`<span style="color:#f59e0b;font-size:10px;margin-right:6px;display:inline-flex;align-items:center;gap:3px;vertical-align:middle">${iconSvg('pin',10)}PINNED</span>`:''}${esc(n.q)}</div>${opts}<div class="poll-voters">${total} vote${total!==1?'s':''}</div></div><div style="display:flex;gap:10px;${isMe?'flex-direction:row-reverse':''}"><button class="ndel" onclick="togglePinPoll('${n.id}')">${n.pinned?'Unpin':'Pin'}</button>${isMe?`<button class="ndel" onclick="delNote('${n.id}')">Delete poll</button>`:''}</div></div>`;}
function togglePinPoll(nid){state.notes=state.notes.map(n=>n.id!==nid?n:{...n,pinned:!n.pinned});haptic(8);renderContent();save();}
function showPicker(e,nid){e.stopPropagation();document.querySelectorAll('.epicker').forEach(p=>p.remove());if(openPicker===nid){openPicker=null;return;}openPicker=nid;const p=document.createElement('div');p.className='epicker';p.innerHTML=EMOJIS.map(em=>`<button class="eopt" onclick="toggleRx('${nid}','${em}');closePicker()">${em}</button>`).join('');document.getElementById('rb'+nid)?.appendChild(p);setTimeout(()=>document.addEventListener('click',closePicker,{once:true}),10);}
function closePicker(){document.querySelectorAll('.epicker').forEach(p=>p.remove());openPicker=null;}
function toggleRx(nid,emoji){closePicker();haptic(8);state.notes=state.notes.map(n=>{if(n.id!==nid)return n;const rx={...(n.reactions||{})},who=[...(rx[emoji]||[])];const idx=who.indexOf(member);if(idx>=0)who.splice(idx,1);else who.push(member);if(!who.length)delete rx[emoji];else rx[emoji]=who;return{...n,reactions:rx};});renderContent();save();}
function showUndoToast(msg,onUndo){document.querySelector('.undo-toast')?.remove();const t=document.createElement('div');t.className='undo-toast';t.innerHTML=`<span class="undo-txt">${msg}</span><button class="undo-btn" onclick="this.closest('.undo-toast')._undo()">Undo</button>`;t._undo=()=>{clearTimeout(undoTimer);t.remove();onUndo();};document.body.appendChild(t);undoTimer=setTimeout(()=>t.remove(),4500);}
function addPhoto(itemId){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const canvas=document.createElement('canvas'),img=new Image();img.onload=()=>{const MAX=320,ratio=Math.min(MAX/img.width,MAX/img.height,1);canvas.width=img.width*ratio;canvas.height=img.height*ratio;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const b64=canvas.toDataURL('image/jpeg',0.75);const k=tabIdx===0?'shop':'todo';state[k]=state[k].map(i=>i.id===itemId?{...i,photo:b64}:i);renderContent();save();};img.src=URL.createObjectURL(file);};inp.click();}
function viewPhoto(b64){const m=document.createElement('div');m.className='photo-modal';m.innerHTML=`<img src="${b64}"><button class="photo-modal-close" onclick="this.parentElement.remove()">✕</button>`;m.onclick=e=>{if(e.target===m)m.remove();};document.body.appendChild(m);}
function addItem(){const inp=document.getElementById('mi'),text=inp?.value.trim();if(!text)return;const isS=tabIdx===0,urg=isS?shopUrg:todoUrg,autoCat=isS?suggestCat(text):'';const it={id:genId(),text,urgency:urg,cat:autoCat,addedBy:member,done:false,ts:Date.now()};if(isS)state.shop=[it,...state.shop];else state.todo=[it,...state.todo];if(isS){shopUrg=0;}else{todoUrg=0;}inp.value='';shouldFocus=true;haptic(8);renderTabs();renderContent();save();queueNotif(isS?'shop':'todo',member,text);}
function setUrg(i){const inp=document.getElementById('mi'),saved=inp?inp.value:'';if(tabIdx===0)shopUrg=i;else todoUrg=i;renderContent();const mi=document.getElementById('mi');if(mi&&saved){mi.value=saved;mi.focus();}}
function cycleUrg(e,id){e.stopPropagation();haptic(8);const k=tabIdx===0?'shop':'todo';state[k]=state[k].map(i=>i.id!==id?i:{...i,urgency:((i.urgency??0)+1)%3});renderContent();save();}
function toggleItem(id){haptic([8,20,8]);const k=tabIdx===0?'shop':'todo';const it=state[k].find(i=>i.id===id);if(!it)return;const nowDone=!it.done;state[k]=state[k].map(i=>i.id===id?{...i,done:nowDone,doneBy:nowDone?member:undefined}:i);if(nowDone){showUndoToast(`Ticked off "${it.text.slice(0,28)}"`,()=>{state[k]=state[k].map(i=>i.id===id?{...i,done:false,doneBy:undefined}:i);renderTabs();renderContent();save();});}renderTabs();renderContent();save();}
function delItem(id){const k=tabIdx===0?'shop':'todo';state[k]=state[k].filter(i=>i.id!==id);renderTabs();renderContent();save();}
function clearDone(){const k=tabIdx===0?'shop':'todo';state[k]=state[k].filter(i=>!i.done);renderTabs();renderContent();save();}
function postNote(){const inp=document.getElementById('ni');const text=inp?.value.trim();if(!text||!inp)return;inp.value='';inp.focus();const note={id:genId(),text,author:member,ts:Date.now(),reactions:{}};state.notes=[note,...state.notes];haptic(8);const feed=document.querySelector('.msg-feed');if(feed){const auth=getMem(member);const div=document.createElement('div');div.className='nwrap mine';div.style.cssText='animation:itemIn .2s var(--ease) both';div.innerHTML=`<div class="nhdr" style="flex-direction:row-reverse"><div class="av" style="width:26px;height:26px;font-size:10px;color:${auth.color};background:${auth.color}18;border:2px solid ${auth.color}44;border-radius:28%">${auth.initials}</div><span class="nauthor" style="color:${auth.color}">${esc(member)}</span><span class="ntime">just now</span></div><div class="nbubble mine" style="background:${auth.color}18;border-color:${auth.color}44"><div class="ntext">${esc(text)}</div></div><div class="rbar" id="rb${note.id}"><button class="radd" onclick="showPicker(event,'${note.id}')">+</button></div><button class="ndel" onclick="delNote('${note.id}')">Delete</button>`;feed.insertBefore(div,feed.firstChild);feed.querySelector('.empty')?.remove();}requestAnimationFrame(()=>{const again=document.getElementById('ni');if(again)again.focus();});save();queueNotif('msg',member,text);renderTabs();}
function delNote(id){state.notes=state.notes.filter(n=>n.id!==id);renderContent();save();}
function setFilter(n){const arr=tabIdx===0?shopFilters:todoFilters;if(n==='All'){arr.length=0;}else{const i=arr.indexOf(n);if(i>=0)arr.splice(i,1);else arr.push(n);}renderContent();if(filterSheetOpen)renderFilterSheetContent();}
function hasActiveFilters(){if(tabIdx===0)return shopFilters.length>0||shopCats.length>0||shopSort!=='recency-desc';if(tabIdx===1)return todoFilters.length>0||todoSort!=='urgency-desc';return false;}
function openFilterSheet(){filterSheetOpen=true;renderFilterSheetContent();document.getElementById('fsheet').classList.add('open');document.getElementById('fsheet-back').classList.add('open');}
function closeFilterSheet(){filterSheetOpen=false;document.getElementById('fsheet').classList.remove('open');document.getElementById('fsheet-back').classList.remove('open');}
function clearFilters(){if(tabIdx===0){shopFilters.length=0;shopCats.length=0;shopSort='recency-desc';}else if(tabIdx===1){todoFilters.length=0;todoSort='urgency-desc';}renderContent();renderFilterSheetContent();}
function renderFilterSheetContent(){const sheet=document.getElementById('fsheet');if(!sheet)return;if(tabIdx>=2){sheet.innerHTML='';return;}const isS=tabIdx===0,filters=isS?shopFilters:todoFilters,sort=isS?shopSort:todoSort,acc=TABS[tabIdx].accent;const pills=['All',...MEMBERS.map(x=>x.name)].map(n=>{const mx=n==='All'?null:getMem(n),active=n==='All'?filters.length===0:filters.includes(n),col=mx?mx.color:acc;return`<button class="f-btn" onclick="setFilter('${n}')" style="border-color:${active?col:'var(--brd)'};background:${active?col+'18':'transparent'};color:${active?col:'var(--muted)'}">${mx?`<div class="av" style="width:12px;height:12px;font-size:5.5px;color:${mx.color};background:${mx.color}18;border:1px solid ${mx.color}44;border-radius:30%">${mx.initials}</div>`:''}${esc(n)}</button>`;}).join('');const catPills=isS?['All',...CATS.map(c=>c.id)].map(cid=>{const ci=CATS.find(c=>c.id===cid),active=cid==='All'?shopCats.length===0:shopCats.includes(cid);return`<button class="f-btn" onclick="setCat('${cid}')" style="border-color:${active?acc:'var(--brd)'};background:${active?acc+'18':'transparent'};color:${active?acc:'var(--muted)'}">${cid==='All'?'All':ci.label}</button>`;}).join(''):'';sheet.innerHTML=`<div class="fsheet-grip"></div><div class="fsheet-hdr"><div class="fsheet-title">Filter &amp; Sort</div><button class="fsheet-done" onclick="closeFilterSheet()">Done</button></div><div class="fsheet-sec"><div class="fsheet-lbl">Sort by</div><select class="sort-sel" style="color:${acc};border-color:${acc}44" onchange="setSort(this.value)">${SORTS.map(o=>`<option value="${o.key}"${sort===o.key?' selected':''}>${o.label}</option>`).join('')}</select></div><div class="fsheet-sec"><div class="fsheet-lbl">Show items from</div><div class="fsheet-pills">${pills}</div></div>${isS?`<div class="fsheet-sec"><div class="fsheet-lbl">Category</div><div class="fsheet-pills">${catPills}</div></div>`:''}${hasActiveFilters()?`<button class="fsheet-clear" onclick="clearFilters()">Reset to defaults</button>`:''}`;}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent);}
function renderInstallBanner(){}
function checkVersionUpdate(){
  const last=localStorage.getItem('cfh-last-ver');
  if(last!==VER){
    localStorage.setItem('cfh-last-ver',VER);
    if(last){setTimeout(showUpdatePopup,900);}
  }
}
function showUpdatePopup(){
  if(document.querySelector('.app-popup-back'))return;
  const notes=`<b>What's new in ${VER}:</b><br>• Real slide between tabs<br>• Smoother pull-to-refresh<br>• Reworked swipe-to-delete<br>• Multi-select filters<br>• Edge-aware tab swipes<br>• No more self-notifications`;
  const back=document.createElement('div');
  back.className='app-popup-back';
  back.innerHTML=`<div class="app-popup"><div class="app-popup-ico">✨</div><div class="app-popup-title">Updated</div><div class="app-popup-sub">Now on ${VER}</div><div class="app-popup-body">${notes}</div><button class="app-popup-btn" onclick="this.closest('.app-popup-back').remove()">Got it</button></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
}
function checkInstallPrompt(){
  if(isStandalone())return;
  if(localStorage.getItem('cfh-install-seen'))return;
  localStorage.setItem('cfh-install-seen','1');
  setTimeout(showInstallPopup,2200);
}
function showInstallPopup(){
  if(document.querySelector('.app-popup-back'))return;
  const ios=isIOS();
  const steps=ios
    ?[['1','Tap the <b>Share</b> button at the bottom of Safari'],['2','Scroll down and tap <b>Add to Home Screen</b>'],['3','Tap <b>Add</b> — the app will appear on your home screen']]
    :[['1','Tap the menu (<b>⋮</b>) in Chrome'],['2','Tap <b>Install app</b> or <b>Add to Home screen</b>'],['3','Open it from your home screen like any app']];
  const stepsHTML=steps.map(s=>`<div class="app-popup-step"><div class="app-popup-step-n">${s[0]}</div><div>${s[1]}</div></div>`).join('');
  const back=document.createElement('div');
  back.className='app-popup-back';
  back.innerHTML=`<div class="app-popup"><div class="app-popup-ico">📱</div><div class="app-popup-title">Install as an app</div><div class="app-popup-sub">${ios?'iOS / Safari':'Android / Chrome'}</div><div class="app-popup-steps">${stepsHTML}</div><button class="app-popup-btn" onclick="this.closest('.app-popup-back').remove()">Got it</button><button class="app-popup-dismiss" onclick="this.closest('.app-popup-back').remove()">Maybe later</button></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
}
async function initPush(){if(!('serviceWorker' in navigator)||!('PushManager' in window))return;try{if(!swReg)swReg=await navigator.serviceWorker.register('/cheema-family-hub/sw.js',{scope:'/cheema-family-hub/'});await navigator.serviceWorker.ready;const existing=await swReg.pushManager.getSubscription();if(existing&&Notification.permission==='granted'){const key=existing.endpoint.split('/').pop().replace(/[^a-zA-Z0-9]/g,'').slice(-20)||'sub'+Date.now();await fetch(`https://cheema-79800-default-rtdb.europe-west1.firebasedatabase.app/subscriptions/${key}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...existing.toJSON(),member})});}}catch(e){}}
function initTabSwipe(){
  if(document._tsb)return;
  document._tsb=true;
  const EDGE_PX=26;
  let sx=0,sy=0,active=false,decided=false,fromEdge=false;
  const ignoreSel='.swipe-outer,.item,.swipe-wrap,.filter-row,.urg-row,.cat-row,.poll-option,.input-card,.msg-compose,.fsheet,.app-popup-back,.photo-modal,textarea,input,select';
  document.addEventListener('touchstart',e=>{
    active=false;decided=false;fromEdge=false;
    const app=document.getElementById('app');
    if(!app||!app.classList.contains('active'))return;
    if(filterSheetOpen||transitioning)return;
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;
    fromEdge=(sx<EDGE_PX)||(sx>window.innerWidth-EDGE_PX);
    // Edge swipes always register so browser back-gestures don't eat them
    if(!fromEdge&&e.target.closest(ignoreSel))return;
    active=true;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!active)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!decided&&(Math.abs(dx)>8||Math.abs(dy)>8)){
      decided=true;
      // Stricter vertical reject unless starting from edge
      const tol=fromEdge?1.1:.8;
      if(Math.abs(dy)>Math.abs(dx)*tol)active=false;
    }
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!active)return;
    active=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    const minDx=fromEdge?40:60;
    if(Math.abs(dx)<minDx||Math.abs(dy)>Math.abs(dx)*.65||transitioning)return;
    if(dx<0&&tabIdx<TABS.length-1)setTab(tabIdx+1);
    else if(dx>0&&tabIdx>0)setTab(tabIdx-1);
  },{passive:true});
}
async function init(){try{initTheme();}catch(e){}showScreen('loading');const cache=loadCache();if(cache){state=cache.state;}try{await initSW();}catch(e){}try{const d=await fbRead();state={shop:d.shop,todo:d.todo,notes:d.notes,notices:d.notices};lastTs=d.updatedAt;cacheState();setStatus('live');setOffline(false);}catch(e){if(!cache){setStatus('error');renderLogin();showScreen('login');return;}setStatus('offline');setOffline(true);}try{renderLogin();const saved=localStorage.getItem('cfh_member');const ok=saved&&MEMBERS.find(m=>m.name===saved);if(ok){selectMember(saved);}else{showScreen('login');}startPoll();}catch(e){showScreen('login');}try{loadTgCfg();}catch(e){}try{initPush();}catch(e){}try{checkVersionUpdate();}catch(e){}try{checkInstallPrompt();}catch(e){}window.addEventListener('online',()=>{setOffline(false);setStatus('live');save();});window.addEventListener('offline',()=>{setOffline(true);setStatus('offline');});}
init();
